<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Curry Grand Prix - Neo Retro Cam</title>
    <style>
        :root {
            --bg-color: #0c0e12;
            --surface-bg: rgba(22, 26, 34, 0.78);
            --surface-border: rgba(255, 255, 255, 0.09);
            --card-bg: rgba(255, 255, 255, 0.04);
            --accent-color: #ff9f1a;
            --accent-glow: rgba(255, 159, 26, 0.38);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --danger: #ef4444;
            --shutter-red: #e11d48;
            --free-color: #22c55e;
            --free-glow: rgba(34, 197, 94, 0.35);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, monospace;
            display: flex;
            height: 100dvh;
            width: 100dvw;
            overflow: hidden;
            flex-direction: row;
        }

        /* ============================
           左側：ファインダー・ビューエリア
           ============================ */
        .left-viewport {
            flex: 1.25;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #161b24 0%, #07090c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            padding-left: max(14px, env(safe-area-inset-left));
        }

        /* CURRENT MISSION フローティングバナー */
        #mission-guide {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 28px);
            max-width: 480px;
            background: rgba(12, 14, 18, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 159, 26, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65), 0 0 16px var(--accent-glow);
            border-radius: 12px;
            padding: 7px 12px;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        #mission-guide.is-free {
            border-color: rgba(34, 197, 94, 0.55);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65), 0 0 16px var(--free-glow);
        }

        .guide-pill {
            display: inline-block;
            font-size: 8.5px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #0c0e12;
            background: var(--accent-color);
            padding: 2px 7px;
            border-radius: 9999px;
            margin-bottom: 3px;
        }

        #mission-guide.is-free .guide-pill {
            background: var(--free-color);
            color: #07150b;
        }

        .guide-title {
            font-size: 12.5px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.2px;
        }

        .guide-task {
            font-size: 9.5px;
            color: #d1d5db;
            margin-top: 2px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 3:2ファインダー枠 */
        .viewfinder-wrapper {
            position: relative;
            width: min(92%, 480px);
            aspect-ratio: 3 / 2;
            border-radius: 16px;
            padding: 3px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.03));
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75);
        }

        .viewfinder-inner {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 13px;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(var(--zoom-level, 1));
            transition: transform 0.08s ease-out;
        }

        video.selfie {
            transform: scale(var(--zoom-level, 1)) scaleX(-1);
        }

        /* ファインダーのコーナー線 */
        .vf-corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: rgba(255, 255, 255, 0.55);
            border-style: solid;
            pointer-events: none;
            z-index: 5;
        }
        .vf-tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
        .vf-tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
        .vf-bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
        .vf-br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

        /* タイマーカウントダウンオーバーレイ */
        #timer-display {
            visibility: hidden;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--accent-color);
            font-weight: 900;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 20px var(--accent-glow);
            z-index: 15;
            background: rgba(0, 0, 0, 0.35);
        }

        /* ズームバー */
        .zoom-container {
            position: absolute;
            bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(12, 14, 18, 0.72);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 9999px;
            border: 1px solid var(--surface-border);
            z-index: 10;
        }

        .zoom-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .zoom-slider {
            width: 90px;
            height: 4px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        /* ============================
           右側：操作コントロールデッキ
           ============================ */
        .right-deck {
            flex: 0.95;
            height: 100%;
            background: var(--surface-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--surface-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 18px;
            padding-right: max(18px, env(safe-area-inset-right));
            overflow-y: auto;
            position: relative;
            z-index: 10;
        }

        /* 上部スタック：TEAM SELECT（上） & REMAINING（下） */
        .deck-top-stack {
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 100%;
        }

        /* チーム選択ボックス */
        .team-select-box {
            background: var(--card-bg);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
        }

        .deck-label {
            font-size: 9px;
            font-weight: 800;
            color: var(--text-sub);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* タップしやすい大型プルダウン（セレクト） */
        .large-team-select-wrapper {
            position: relative;
            width: 100%;
        }

        .large-team-select {
            width: 100%;
            height: 44px;
            background: rgba(0, 0, 0, 0.55);
            color: var(--accent-color);
            border: 1.5px solid rgba(255, 159, 26, 0.45);
            border-radius: 8px;
            padding: 0 36px 0 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.2s ease;
        }

        .large-team-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .large-team-select option {
            background: #141820;
            color: #fff;
            font-size: 14px;
            padding: 8px;
        }

        /* プルダウンのカスタム矢印 */
        .large-team-select-wrapper::after {
            content: "▼";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: var(--accent-color);
            pointer-events: none;
        }

        /* 選択確定後の表示（プルダウンは非表示になり、こちらを表示） */
        .team-confirmed-view {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 8px;
            background: rgba(255, 159, 26, 0.08);
            border: 1px solid rgba(255, 159, 26, 0.35);
            border-radius: 8px;
        }

        .team-confirmed-name {
            font-size: 16px;
            font-weight: 900;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .team-locked-tag {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 6px;
            border-radius: 4px;
        }

        /* 残り枚数カウンター */
        .counter-box {
            background: linear-gradient(145deg, rgba(255, 159, 26, 0.1), rgba(0, 0, 0, 0.4));
            border: 1px solid rgba(255, 159, 26, 0.3);
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s;
        }

        .counter-box:active {
            transform: scale(0.98);
            border-color: var(--accent-color);
        }

        .counter-num-box {
            display: flex;
            align-items: baseline;
            gap: 4px;
            line-height: 1;
        }

        .counter-num {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .counter-num.is-free {
            color: var(--free-color);
            text-shadow: 0 0 12px var(--free-glow);
            font-size: 1.5rem;
        }

        .counter-sub {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 700;
        }

        /* 中部ボタングリッド */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin: 8px 0;
        }

        .deck-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--surface-border);
            padding: 9px 8px;
            border-radius: 10px;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .deck-btn:active {
            transform: scale(0.96);
        }

        .deck-btn.active-state {
            background: var(--accent-color);
            color: #0c0e12;
            border-color: var(--accent-color);
            box-shadow: 0 0 14px var(--accent-glow);
        }

        .btn-full {
            grid-column: span 2;
            padding: 10px;
        }

        /* 下部シャッターセクション */
        .shutter-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 4px;
        }

        .shutter-outer {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1e232d, #0d0f14);
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #shutter {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.25);
            background: radial-gradient(circle at 35% 35%, #ff4b72 0%, var(--shutter-red) 70%, #9f1239 100%);
            box-shadow: 0 5px 0 #881337, 0 8px 18px rgba(225, 29, 72, 0.4);
            cursor: pointer;
            transition: all 0.1s ease;
            outline: none;
        }

        #shutter:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #881337, 0 4px 10px rgba(225, 29, 72, 0.3);
        }

        #shutter:disabled {
            background: #2b303b;
            box-shadow: none;
            border-color: rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
            transform: none;
            opacity: 0.35;
        }

        .charge-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid transparent;
            pointer-events: none;
            transition: border-color 0.3s;
        }

        .is-charging .charge-ring {
            border-color: var(--accent-color);
            animation: spin 3s linear forwards;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); opacity: 1; }
            90% { transform: rotate(360deg); opacity: 1; }
            100% { transform: rotate(360deg); opacity: 0; }
        }

        #status-msg {
            margin-top: 6px;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        #status-msg.charging {
            color: var(--accent-color);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* モーダル群 */
        .modal-layer {
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 14, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            display: none;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-box {
            max-width: 500px;
            margin: 20px auto;
            background: #141820;
            border: 1px solid var(--surface-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .mission-item-card {
            background: var(--card-bg);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            position: relative;
            transition: all 0.2s ease;
        }

        .mission-item-card.is-current {
            background: rgba(255, 159, 26, 0.08);
            border: 1.5px solid var(--accent-color);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .current-badge {
            display: none;
            position: absolute;
            top: 10px;
            right: 12px;
            background: var(--accent-color);
            color: #0c0e12;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .mission-item-card.is-current .current-badge {
            display: inline-block;
        }

        /* プレビューモーダル（ミッション00限定） */
        #preview-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .preview-card {
            background: #161922;
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 92%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        #preview-image {
            width: 100%;
            max-width: 440px;
            aspect-ratio: 3 / 2;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }

        .preview-btn {
            background: var(--accent-color);
            color: #0c0e12;
            border: none;
            padding: 10px 32px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- 撮影プレビューモーダル（ミッション00限定） -->
    <div id="preview-modal">
        <div class="preview-card">
            <div style="font-size: 12px; font-weight: bold; color: var(--accent-color); letter-spacing: 1px;">TEST SHOT CHECK</div>
            <img id="preview-image" src="" alt="Test Preview">
            <button id="preview-confirm-btn" class="preview-btn">チェックOK</button>
        </div>
    </div>

    <!-- ミッション一覧モーダル -->
    <div id="mission-overlay" class="modal-layer">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); padding-bottom: 10px; margin-bottom: 14px;">
                <h3 style="color: var(--accent-color); margin: 0; font-size: 14px; letter-spacing: 0.5px;" id="modal-team-title">MISSION LIST</h3>
                <span style="font-size: 11px; color: var(--text-sub); cursor: pointer;" id="modalCloseBtn">✕ 閉じる</span>
            </div>
            <div id="mission-list-content"></div>
            <p style="text-align: center; font-size: 10px; color: var(--text-sub); margin-top: 14px;">(タップして閉じる)</p>
        </div>
    </div>

    <!-- 左画面：3:2ファインダービュー -->
    <div class="left-viewport">
        <div id="mission-guide">
            <div class="guide-pill" id="guide-pill-badge">CURRENT MISSION</div>
            <div id="guide-title" class="guide-title">チームを選択してください</div>
            <div id="guide-task" class="guide-task"></div>
        </div>

        <div class="viewfinder-wrapper">
            <div class="viewfinder-inner">
                <span class="vf-corner vf-tl"></span>
                <span class="vf-corner vf-tr"></span>
                <span class="vf-corner vf-bl"></span>
                <span class="vf-corner vf-br"></span>
                <video id="video" autoplay playsinline></video>
                <div id="timer-display">5</div>
            </div>
        </div>

        <div class="zoom-container">
            <span class="zoom-label">1x</span>
            <input type="range" id="zoomRange" class="zoom-slider" min="1" max="3" step="0.1" value="1">
            <span class="zoom-label">3x</span>
        </div>
    </div>

    <!-- 右画面：統合コントロールデッキ -->
    <div class="right-deck">
        <div class="deck-top-stack">
            <!-- チーム選択（大型プルダウン） -->
            <div class="team-select-box">
                <span class="deck-label">TEAM SELECT</span>
                <div class="large-team-select-wrapper" id="teamSelectWrapper">
                    <select id="teamSelect" class="large-team-select">
                        <option value="">タップしてチームを選択 ▼</option>
                        <option value="A">チーム A</option>
                        <option value="B">チーム B</option>
                        <option value="C">チーム C</option>
                        <option value="D">チーム D</option>
                    </select>
                </div>
                <!-- 選択確定後の表示（プルダウンは非表示） -->
                <div class="team-confirmed-view" id="teamConfirmedView">
                    <span class="team-confirmed-name" id="teamConfirmedText">チームA</span>
                    <span class="team-locked-tag">LOCKED</span>
                </div>
            </div>

            <!-- 残り枚数カウンター -->
            <div class="counter-box" id="resetTrigger" title="5回連続タップでリセット">
                <div>
                    <span class="deck-label" id="counterLabel">REMAINING</span>
                    <div class="counter-num-box">
                        <span class="counter-num" id="counter">20</span>
                        <span class="counter-sub" id="counterTotal">/ 20</span>
                    </div>
                </div>
                <div style="font-size: 10px; color: var(--text-sub); text-align: right; line-height: 1.2;">
                    <div>SHOTS</div>
                    <div style="font-size: 8px; opacity: 0.7;">(5 TAP RESET)</div>
                </div>
            </div>
        </div>

        <!-- 中段：機能ボタングリッド -->
        <div class="controls-grid">
            <button class="deck-btn btn-full" id="missionBtn">📋 ミッション全指令を見る</button>
            <button class="deck-btn" id="flashBtn">⚡ FLASH OFF</button>
            <button class="deck-btn" id="switchBtn">🔄 カメラ切替</button>
            <button class="deck-btn" id="timerBtn">⏱️ 5秒タイマー</button>
            <button class="deck-btn" id="powerBtn">📷 CAMERA ON</button>
        </div>

        <!-- 下段：シャッターボタン＆チャージステータス -->
        <div class="shutter-section" id="shutterContainer">
            <div class="shutter-outer">
                <div class="charge-ring"></div>
                <button id="shutter" disabled aria-label="シャッター"></button>
            </div>
            <div id="status-msg">READY</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- 1. Firebase設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyDHqQDeEMrFV09YI0n_ARr1Tzta5aqmE2U",
            authDomain: "my-retro-cam.firebaseapp.com",
            projectId: "my-retro-cam",
            storageBucket: "my-retro-cam.firebasestorage.app",
            messagingSenderId: "700098109654",
            appId: "1:700098109654:web:9d679cbd092c1376642977"
        };

        let app, storage, auth;
        let isAuthReady = false;
        if (firebaseConfig.apiKey) {
            try {
                app = initializeApp(firebaseConfig);
                storage = getStorage(app);
                auth = getAuth(app);
                onAuthStateChanged(auth, (u) => { 
                    if (u) { isAuthReady = true; syncPhotos(); } 
                    else signInAnonymously(auth); 
                });
            } catch (err) {
                console.warn("Firebase Init:", err);
            }
        }

        // --- IndexedDB ---
        const dbName = "CurryGrandPrixDB";
        const storeName = "photoQueue";
        let db, stream = null;
        const dbRequest = indexedDB.open(dbName, 1);
        dbRequest.onupgradeneeded = e => e.target.result.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
        dbRequest.onsuccess = e => { db = e.target.result; syncPhotos(); };

        const MAX_SHOTS = 20;

        // --- ミッション構成（全7項目・計20枚配分） ---
        const commonMissions = [
            { id: "00", threshold: 18, title: "0.操作練習：【テスト撮影】", task: "フラッシュやタイマー、構図を試してみよう！" },
            { id: "01", threshold: 15, title: "1.集合：【決起集会】", task: "優勝を誓うガッツポーズ集合写真！" },
            { id: "02", threshold: 12, title: "2.買い出し：【目利きの極意】", task: "極上スパイスや隠し味を真剣に見極める姿。" },
            { id: "03", threshold: 9,  title: "3.会場散策①：【放課後の記憶】", task: "廃校の長い廊下や教室、黒板を背にしたノスタルジーな青春の1枚。" },
            { id: "04", threshold: 6,  title: "4.会場散策②：【偵察部隊】", task: "ライバルチームを遠巻きに観察・警戒する姿。" },
            { id: "05", threshold: 3,  title: "5.調理中：【シェフの神業】", task: "ルーを投入する瞬間や躍動感ある鍋振り！" },
            { id: "06", threshold: 0,  title: "6.BBQ：【完成の歓喜】", task: "丹精込めて完成させたカレーを全員で囲んだ笑顔ショット。" }
        ];

        const missionsData = {
            "A": commonMissions,
            "B": commonMissions,
            "C": commonMissions,
            "D": commonMissions
        };

        // DOM参照
        const teamSelectWrapper = document.getElementById('teamSelectWrapper');
        const teamSelect = document.getElementById('teamSelect');
        const teamConfirmedView = document.getElementById('teamConfirmedView');
        const teamConfirmedText = document.getElementById('teamConfirmedText');
        const counterDisplay = document.getElementById('counter');
        const counterLabel = document.getElementById('counterLabel');
        const counterTotal = document.getElementById('counterTotal');
        const shutterBtn = document.getElementById('shutter');
        const shutterContainer = document.getElementById('shutterContainer');
        const missionGuide = document.getElementById('mission-guide');
        const guidePillBadge = document.getElementById('guide-pill-badge');
        const guideTitle = document.getElementById('guide-title');
        const guideTask = document.getElementById('guide-task');
        const statusMsg = document.getElementById('status-msg');
        const flashBtn = document.getElementById('flashBtn');
        const timerBtn = document.getElementById('timerBtn');
        const powerBtn = document.getElementById('powerBtn');
        const previewModal = document.getElementById('preview-modal');
        const previewImg = document.getElementById('preview-image');
        const previewConfirmBtn = document.getElementById('preview-confirm-btn');

        let selectedCar = localStorage.getItem('curry_team') || "";
        let shotCount = 0;
        let isFlashOn = false, isCameraOn = false, isTimerActive = false, isCapturing = false;
        let currentFacingMode = "environment";
        let resetClickCount = 0;

        window.onload = () => {
            if (selectedCar) {
                applyTeamSelectedUI(selectedCar);
                loadCount();
            }
            startCamera();
            updateUI();
        };

        function loadCount() {
            if (!selectedCar) return;
            shotCount = parseInt(localStorage.getItem(`curry_count_${selectedCar}`)) || 0;
        }

        // 大型プルダウンの選択変更イベント
        teamSelect.onchange = () => {
            const team = teamSelect.value;
            if (team) {
                selectedCar = team;
                localStorage.setItem('curry_team', selectedCar);
                applyTeamSelectedUI(selectedCar);
                loadCount();
                updateUI();
            }
        };

        // テスト用：カウンターを長押しまたはダブルタップで枚数を設定するプロンプトを出す
        document.getElementById('counter').ondblclick = () => {
            const input = prompt("【テスト用】残り枚数を入力してください（0〜20）:", "3");
        if (input !== null) {
            const remaining = parseInt(input);
            shotCount = MAX_SHOTS - remaining;
            localStorage.setItem(`curry_count_${selectedCar}`, shotCount);
            updateUI();
            }   
        };

        function applyTeamSelectedUI(team) {
            teamSelectWrapper.style.display = 'none';
            teamConfirmedView.style.display = 'flex';
            teamConfirmedText.innerText = `チーム${team}`;
            document.getElementById('modal-team-title').innerText = `TEAM ${team} - MISSION LIST`;
        }

        function getCurrentMissionInfo() {
            if (!selectedCar) return null;
            const remaining = MAX_SHOTS - shotCount;
            if (remaining <= 0) {
                return { isFree: true, id: "free", label: "フリーモード" };
            }
            const mList = missionsData[selectedCar];
            const current = mList.find(m => remaining > m.threshold);
            return {
                isFree: false,
                id: current ? current.id : "06",
                mission: current
            };
        }

        function updateUI() {
            if (!selectedCar) {
                counterDisplay.innerText = MAX_SHOTS;
                counterDisplay.classList.remove('is-free');
                counterTotal.style.display = 'inline';
                counterLabel.innerText = "REMAINING";
                guidePillBadge.innerText = "SELECT TEAM";
                guideTitle.innerText = "チームを選択してください";
                guideTask.innerText = "";
                missionGuide.classList.remove('is-free');
                shutterBtn.disabled = true;
                return;
            }

            const remaining = MAX_SHOTS - shotCount;
            const mInfo = getCurrentMissionInfo();

            if (mInfo && mInfo.isFree) {
                // フリーモード
                const freeCount = shotCount - MAX_SHOTS;
                counterDisplay.innerText = freeCount > 0 ? `+${freeCount}` : "FREE";
                counterDisplay.classList.add('is-free');
                counterTotal.style.display = 'none';
                counterLabel.innerText = "FREE MODE";

                missionGuide.classList.add('is-free');
                guidePillBadge.innerText = "FREE MODE";
                guideTitle.innerText = "フリー撮影モード";
                guideTask.innerText = "全ミッション達成！自由に思い出を記録しよう！";

                shutterBtn.disabled = (isCapturing || !isCameraOn);
            } else {
                // 通常ミッション
                counterDisplay.innerText = remaining;
                counterDisplay.classList.remove('is-free');
                counterTotal.style.display = 'inline';
                counterLabel.innerText = "REMAINING";

                missionGuide.classList.remove('is-free');
                guidePillBadge.innerText = "CURRENT MISSION";

                if (mInfo && mInfo.mission) {
                    guideTitle.innerText = mInfo.mission.title;
                    guideTask.innerText = mInfo.mission.task;
                }

                shutterBtn.disabled = (isCapturing || !isCameraOn);
            }
        }

        async function startCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                const videoEl = document.getElementById('video');
                videoEl.srcObject = stream;
                videoEl.classList.toggle('selfie', currentFacingMode === "user");
                isCameraOn = true;
                powerBtn.innerText = "📷 CAMERA OFF";
                powerBtn.classList.add('active-state');
                updateUI();
                if (isFlashOn) setTimeout(() => applyTorch(true), 1000);
            } catch (e) {
                statusMsg.innerText = "CAMERA ERROR";
                console.error(e);
            }
        }

        async function applyTorch(state) {
            if (!stream || currentFacingMode === "user") return;
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                try { await track.applyConstraints({ advanced: [{ torch: state }] }); } catch (err) {}
            }
        }

        flashBtn.onclick = () => {
            if (currentFacingMode === "user") return;
            isFlashOn = !isFlashOn;
            flashBtn.innerText = isFlashOn ? "⚡ FLASH ON" : "⚡ FLASH OFF";
            flashBtn.classList.toggle('active-state', isFlashOn);
            applyTorch(isFlashOn);
        };

        document.getElementById('switchBtn').onclick = () => {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            startCamera();
        };

        timerBtn.onclick = () => {
            isTimerActive = !isTimerActive;
            timerBtn.classList.toggle('active-state', isTimerActive);
        };

        powerBtn.onclick = () => {
            if (isCameraOn) {
                if (stream) stream.getTracks().forEach(t => t.stop());
                isCameraOn = false;
                powerBtn.innerText = "📷 CAMERA ON";
                powerBtn.classList.remove('active-state');
            } else {
                startCamera();
            }
            updateUI();
        };

        document.getElementById('zoomRange').oninput = (e) => {
            document.getElementById('video').style.setProperty('--zoom-level', e.target.value);
        };

        shutterBtn.onclick = () => {
            if (isCapturing || shutterBtn.disabled) return;
            isCapturing = true;
            shutterBtn.disabled = true;

            if (isTimerActive) {
                let c = 5;
                const timerDisp = document.getElementById('timer-display');
                timerDisp.innerText = c;
                timerDisp.style.visibility = "visible";
                const itv = setInterval(() => {
                    c--;
                    if (c > 0) {
                        timerDisp.innerText = c;
                    } else {
                        clearInterval(itv);
                        timerDisp.style.visibility = "hidden";
                        executeCapture();
                        isTimerActive = false;
                        timerBtn.classList.remove('active-state');
                    }
                }, 1000);
            } else {
                executeCapture();
            }
        };

        function executeCapture() {
            takePicture();
            statusMsg.innerText = "CHARGING...";
            statusMsg.classList.add('charging');
            shutterContainer.classList.add('is-charging');

            setTimeout(() => {
                isCapturing = false;
                statusMsg.innerText = "READY";
                statusMsg.classList.remove('charging');
                shutterContainer.classList.remove('is-charging');
                updateUI();
            }, 3000);
        }

        function takePicture() {
            const targetW = 1800, targetH = 1200;
            const canvas = document.getElementById('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            const v = document.getElementById('video');
            const vw = v.videoWidth, vh = v.videoHeight;
            const zoom = parseFloat(document.getElementById('zoomRange').value);

            let sH = vh / zoom, sW = (sH * 1.5);
            if (sW > vw) { sW = vw / zoom; sH = sW / 1.5; }
            const sX = (vw - sW) / 2, sY = (vh - sH) / 2;

            ctx.drawImage(v, sX, sY, sW, sH, 0, 0, targetW, targetH);
            applyEffects(ctx, targetW, targetH);

            const remainingBeforeShot = MAX_SHOTS - shotCount;
            const isPracticeMission = (remainingBeforeShot > 18);
            const isFreeMode = (remainingBeforeShot <= 0);

            let currentMissionId = "free";
            if (!isFreeMode) {
                const mList = missionsData[selectedCar];
                currentMissionId = (mList.find(m => remainingBeforeShot > m.threshold) || { id: "99" }).id;
            }

            addStamps(ctx, targetW, targetH, currentMissionId, isFreeMode);

            canvas.toBlob(async (blob) => {
                const now = new Date();
                const timeStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
                const fileName = `curry_team${selectedCar}_${currentMissionId}_${timeStr}.jpg`;

                if (db) {
                    const tx = db.transaction(storeName, "readwrite");
                    tx.objectStore(storeName).add({ blob, fileName });
                }

                shotCount++;
                localStorage.setItem(`curry_count_${selectedCar}`, shotCount);

                updateUI();
                syncPhotos();

                // ミッション00（練習）のみプレビュー表示
                if (isPracticeMission) {
                    const previewUrl = URL.createObjectURL(blob);
                    previewImg.src = previewUrl;
                    previewModal.style.display = "flex";

                    previewConfirmBtn.onclick = () => {
                        previewModal.style.display = "none";
                        previewImg.src = "";
                        URL.revokeObjectURL(previewUrl);
                    };
                }
            }, 'image/jpeg', 0.80);
        }

        async function syncPhotos() {
            if (!navigator.onLine || !db || !storage) return;
            const store = db.transaction(storeName, "readwrite").objectStore(storeName);
            const req = store.getAll();
            req.onsuccess = async () => {
                const items = req.result;
                for (const item of items) {
                    try {
                        await uploadBytes(ref(storage, `photos/${item.fileName}`), item.blob);
                        db.transaction(storeName, "readwrite").objectStore(storeName).delete(item.id);
                    } catch (e) { break; }
                }
            };
        }

        function applyEffects(ctx, w, h) {
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255, 150, 0, 0.12)';
            ctx.fillRect(0, 0, w, h);
            
            ctx.fillStyle = isFlashOn ? 'rgba(255, 255, 255, 0.22)' : 'rgba(255, 180, 50, 0.14)';
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';

            const grain = (w * h) / 1.6;
            for (let i = 0; i < grain; i++) {
                const x = Math.random() * w, y = Math.random() * h, opacity = Math.random() * 0.07;
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.fillRect(x, y, 1.2, 1.2);
            }

            const g = ctx.createRadialGradient(w/2, h/2, w/4, w/2, h/2, w/0.8);
            g.addColorStop(0, 'transparent');
            g.addColorStop(1, 'rgba(0,0,0,0.65)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
        }

        // 写真刻印スタンプ：左下に「チーム名 ミッション番号」、右下に「YYYY.MM.DD HH:mm」
        function addStamps(ctx, w, h, mId, isFree) {
            const n = new Date();
            const year = n.getFullYear();
            const month = String(n.getMonth() + 1).padStart(2, '0');
            const day = String(n.getDate()).padStart(2, '0');
            const hours = String(n.getHours()).padStart(2, '0');
            const minutes = String(n.getMinutes()).padStart(2, '0');

            const dateStr = `${year}.${month}.${day} ${hours}:${minutes}`;
            const missionLabel = isFree ? "ミッション:フリーモード" : `ミッション:${mId}`;
            const leftText = `チーム${selectedCar} ${missionLabel}`;

            const fs = Math.floor(w * 0.035);
            ctx.font = `bold ${fs}px "Courier New", "Hiragino Kaku Gothic ProN", sans-serif`;
            ctx.globalAlpha = 0.78;
            ctx.lineWidth = fs / 7;
            ctx.strokeStyle = "rgba(0,0,0,0.6)";
            ctx.fillStyle = "#ff8c21";

            // 左下：チーム名 ＆ ミッション番号
            ctx.textAlign = "left";
            ctx.strokeText(leftText, w * 0.04, h * 0.96);
            ctx.fillText(leftText, w * 0.04, h * 0.96);

            // 右下：年月日 時分 (YYYY.MM.DD HH:mm)
            ctx.textAlign = "right";
            ctx.strokeText(dateStr, w * 0.96, h * 0.96);
            ctx.fillText(dateStr, w * 0.96, h * 0.96);

            ctx.globalAlpha = 1.0;
        }

        // 5連打リセット
        document.getElementById('resetTrigger').onclick = () => {
            resetClickCount++;
            if (resetClickCount >= 5) {
                if (confirm("全リセット（チーム選択・撮影枚数の初期化）を行いますか？")) {
                    localStorage.clear();
                    shotCount = 0;
                    selectedCar = "";
                    teamSelect.value = "";
                    teamSelectWrapper.style.display = 'block';
                    teamConfirmedView.style.display = 'none';
                    updateUI();
                }
                resetClickCount = 0;
            }
            setTimeout(() => { resetClickCount = 0; }, 2000);
        };

        // ミッション一覧モーダル（現在ミッションをハイライト）
        const modal = document.getElementById('mission-overlay');
        document.getElementById('missionBtn').onclick = () => {
            if (!selectedCar) return;
            const list = document.getElementById('mission-list-content');
            list.innerHTML = "";

            const remaining = MAX_SHOTS - shotCount;
            const mList = missionsData[selectedCar];
            const currentMission = remaining > 0 ? mList.find(m => remaining > m.threshold) : null;
            const currentId = currentMission ? currentMission.id : null;

            mList.forEach(m => {
                const isCurrent = (m.id === currentId);
                const card = document.createElement('div');
                card.className = `mission-item-card ${isCurrent ? 'is-current' : ''}`;
                card.innerHTML = `
                    <span class="current-badge">CURRENT</span>
                    <div style="font-weight: 700; font-size: 11.5px; color: ${isCurrent ? 'var(--accent-color)' : '#fff'};">
                        MISSION ${m.id}: ${m.title}
                    </div>
                    <p style="font-size: 10px; color: ${isCurrent ? '#f0f3f6' : 'var(--text-sub)'}; margin: 4px 0 0 0; line-height: 1.4;">
                        ${m.task}
                    </p>
                `;
                list.appendChild(card);
            });
            modal.style.display = "block";
        };

        modal.onclick = (e) => {
            if (e.target === modal || e.target.id === 'modalCloseBtn') {
                modal.style.display = "none";
            }
        };

        window.addEventListener('online', syncPhotos);
    </script>
</body>
</html>

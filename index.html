<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Curry Grand Prix - Retro Cam</title>
    <style>
        :root {
            --bg-base: #0c0e12;
            --panel-bg: rgba(22, 26, 34, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.04);
            --accent: #ff9f1a;
            --accent-glow: rgba(255, 159, 26, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --shutter-red: #e11d48;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            display: flex;
            height: 100dvh;
            width: 100dvw;
            overflow: hidden;
            flex-direction: row;
        }

        /* ============================
           左側：ファインダー・ビューエリア
           ============================ */
        .left-viewport {
            flex: 1.15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #151922 0%, #08090c 100%);
            padding: 16px;
            padding-left: max(16px, env(safe-area-inset-left));
        }

        /* フローティングミッションバナー */
        #mission-guide {
            position: absolute;
            top: 14px;
            width: calc(100% - 32px);
            max-width: 440px;
            background: rgba(12, 14, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--accent);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 16px var(--accent-glow);
            border-radius: 12px;
            padding: 8px 14px;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .guide-pill {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #0c0e12;
            background: var(--accent);
            padding: 2px 8px;
            border-radius: 9999px;
            margin-bottom: 4px;
        }

        .guide-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
        }

        /* 3:2ファインダー枠 */
        .viewfinder-wrapper {
            position: relative;
            width: min(88%, 460px);
            aspect-ratio: 3 / 2;
            border-radius: 16px;
            padding: 3px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02));
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .viewfinder-inner {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 13px;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(var(--zoom-level, 1));
            transition: transform 0.1s ease-out;
        }

        video.selfie {
            transform: scale(var(--zoom-level, 1)) scaleX(-1);
        }

        /* レトロファインダーフレーム（四隅のガイド線） */
        .vf-corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: rgba(255, 255, 255, 0.5);
            border-style: solid;
            pointer-events: none;
            z-index: 5;
        }
        .vf-tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
        .vf-tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
        .vf-bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
        .vf-br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

        /* タイマーカウントダウンオーバーレイ */
        #timer-display {
            visibility: hidden;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--accent);
            font-weight: 900;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 20px var(--accent-glow);
            z-index: 15;
            background: rgba(0, 0, 0, 0.35);
        }

        /* ズームバー下部オーバーレイ */
        .zoom-container {
            position: absolute;
            bottom: 12px;
            width: 70%;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            background: rgba(12, 14, 18, 0.7);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .zoom-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .zoom-slider {
            flex: 1;
            height: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* ============================
           右側：統合モダンコントロールデッキ
           ============================ */
        .right-deck {
            flex: 0.95;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 20px;
            padding-right: max(20px, env(safe-area-inset-right));
            overflow-y: auto;
            position: relative;
        }

        /* 上段：グループ選択 ＆ 残り枚数カウンター */
        .deck-header {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        .group-select-box {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .deck-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .modern-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            color: var(--accent);
            border: 1px solid rgba(255, 159, 26, 0.4);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        .counter-badge {
            flex: 0 0 110px;
            background: linear-gradient(145deg, rgba(255, 159, 26, 0.12), rgba(0, 0, 0, 0.4));
            border: 1px solid rgba(255, 159, 26, 0.3);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s;
        }

        .counter-badge:active {
            transform: scale(0.96);
            border-color: var(--accent);
        }

        .counter-num-box {
            display: flex;
            align-items: baseline;
            line-height: 1;
        }

        .counter-num {
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent);
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .counter-total {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 2px;
            font-weight: 700;
        }

        /* 中段：機能ボタングリッド */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 14px 0;
        }

        .deck-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 11px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .deck-btn:active {
            transform: scale(0.97);
        }

        .deck-btn.active-state {
            background: var(--accent);
            color: #0c0e12;
            border-color: var(--accent);
            font-weight: 800;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .btn-full {
            grid-column: span 2;
        }

        /* 下段：シャッターセクション */
        .shutter-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 6px;
        }

        .shutter-outer {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1f242d, #0d0f13);
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #shutter {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            background: radial-gradient(circle at 35% 35%, #ff4b72 0%, var(--shutter-red) 70%, #9f1239 100%);
            box-shadow: 0 6px 0 #881337, 0 10px 20px rgba(225, 29, 72, 0.4);
            cursor: pointer;
            transition: all 0.1s ease;
            position: relative;
            outline: none;
        }

        #shutter:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #881337, 0 4px 10px rgba(225, 29, 72, 0.3);
        }

        #shutter:disabled {
            background: #2b303b;
            box-shadow: none;
            border-color: rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
            transform: none;
            opacity: 0.4;
        }

        /* チャージプログレスリング（3秒ロック視覚化） */
        .charge-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid transparent;
            pointer-events: none;
            transition: border-color 0.3s;
        }

        .is-charging .charge-ring {
            border-color: var(--accent);
            animation: spin 3s linear forwards;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); opacity: 1; }
            90% { transform: rotate(360deg); opacity: 1; }
            100% { transform: rotate(360deg); opacity: 0; }
        }

        #status-msg {
            margin-top: 8px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        #status-msg.charging {
            color: var(--accent);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* ============================
           ミッションモーダル
           ============================ */
        #mission-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 14, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            display: none;
            padding: 24px 20px;
            overflow-y: auto;
        }

        .modal-card {
            max-width: 520px;
            margin: 20px auto;
            background: #141820;
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0.5px;
            margin: 0;
        }

        .mission-item-card {
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .mission-head {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .mission-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- ミッション一覧モーダル -->
    <div id="mission-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-team-name">MISSION LIST</h3>
                <span style="font-size: 11px; color: var(--text-muted); cursor: pointer;" id="modalCloseBtn">✕ 閉じる</span>
            </div>
            <div id="mission-list-content"></div>
            <p style="text-align: center; font-size: 10px; color: var(--text-muted); margin-top: 18px;">(タップして閉じる)</p>
        </div>
    </div>

    <!-- 左画面：3:2ファインダービュー -->
    <div class="left-viewport">
        <div id="mission-guide">
            <div class="guide-pill">CURRENT MISSION</div>
            <div id="guide-title" class="guide-title">グループを選択してください</div>
        </div>

        <div class="viewfinder-wrapper">
            <div class="viewfinder-inner">
                <span class="vf-corner vf-tl"></span>
                <span class="vf-corner vf-tr"></span>
                <span class="vf-corner vf-bl"></span>
                <span class="vf-corner vf-br"></span>
                <video id="video" autoplay playsinline></video>
                <div id="timer-display">5</div>
            </div>
        </div>

        <div class="zoom-container">
            <span class="zoom-label">1x</span>
            <input type="range" id="zoomRange" class="zoom-slider" min="1" max="3" step="0.1" value="1">
            <span class="zoom-label">3x</span>
        </div>
    </div>

    <!-- 右画面：統合モダンコントロールデッキ -->
    <div class="right-deck">
        <!-- 上段：グループ設定 ＆ 残り枚数 -->
        <div class="deck-header">
            <div class="group-select-box">
                <span class="deck-label">TEAM SELECT</span>
                <select id="carSelect" class="modern-select">
                    <option value="">グループを選択</option>
                    <option value="A">グループ A</option>
                    <option value="B">グループ B</option>
                    <option value="C">グループ C</option>
                    <option value="D">グループ D</option>
                </select>
            </div>

            <div class="counter-badge" id="resetTrigger" title="5回連続タップでリセット">
                <span class="deck-label">REMAINING</span>
                <div class="counter-num-box">
                    <span class="counter-num" id="counter">20</span>
                    <span class="counter-total">/ 20</span>
                </div>
            </div>
        </div>

        <!-- 中段：機能ボタングリッド -->
        <div class="controls-grid">
            <button class="deck-btn btn-full" id="missionBtn">
                📋 ミッション全指令を見る
            </button>
            <button class="deck-btn" id="flashBtn">
                ⚡ FLASH OFF
            </button>
            <button class="deck-btn" id="switchBtn">
                🔄 カメラ切替
            </button>
            <button class="deck-btn" id="timerBtn">
                ⏱️ 5秒タイマー
            </button>
            <button class="deck-btn" id="powerBtn">
                📷 CAMERA ON
            </button>
        </div>

        <!-- 下段：シャッターボタン＆チャージステータス -->
        <div class="shutter-section" id="shutterContainer">
            <div class="shutter-outer">
                <div class="charge-ring"></div>
                <button id="shutter" disabled aria-label="シャッター"></button>
            </div>
            <div id="status-msg">READY</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- 1. Firebase設定 (必要に応じてご自身の情報を貼り付けてください) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDHqQDeEMrFV09YI0n_ARr1Tzta5aqmE2U",
            authDomain: "my-retro-cam.firebaseapp.com",
            projectId: "my-retro-cam",
            storageBucket: "my-retro-cam.firebasestorage.app",
            messagingSenderId: "700098109654",
            appId: "1:700098109654:web:9d679cbd092c1376642977"
        };
        
        let app, storage, auth;
        let isAuthReady = false;
        if (firebaseConfig.apiKey) {
            try {
                app = initializeApp(firebaseConfig);
                storage = getStorage(app);
                auth = getAuth(app);
                onAuthStateChanged(auth, (u) => { 
                    if(u) { isAuthReady = true; syncPhotos(); } 
                    else signInAnonymously(auth); 
                });
            } catch (err) {
                console.warn("Firebase Init Error:", err);
            }
        }

        const dbName = "CurryGrandPrixDB";
        const storeName = "photoQueue";
        let db, stream = null;
        const dbRequest = indexedDB.open(dbName, 1);
        dbRequest.onupgradeneeded = e => e.target.result.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
        dbRequest.onsuccess = e => { db = e.target.result; syncPhotos(); };

        const MAX_SHOTS = 20;

        // --- 全チーム共通ミッション（計6ミッション・全20枚配分） ---
        const commonMissions = [
            { id: "01", threshold: 17, title: "1.集合：【決起集会】", task: "優勝を誓うガッツポーズ集合写真！" },
            { id: "02", threshold: 14, title: "2.買い出し：【目利きの極意】", task: "極上スパイスや隠し味を真剣に見極める姿。" },
            { id: "03", threshold: 10, title: "3.会場散策①：【放課後の記憶】", task: "廃校の長い廊下や教室、黒板を背にしたノスタルジーな青春の1枚。" },
            { id: "04", threshold: 7,  title: "4.会場散策②：【偵察部隊】", task: "ライバルチームを遠巻きに観察・警戒する姿。" },
            { id: "05", threshold: 3,  title: "5.調理中：【シェフの神業】", task: "ルーを投入する瞬間や躍動感ある鍋振り！" },
            { id: "06", threshold: 0,  title: "6.BBQ：【完成の歓喜】", task: "丹精込めて完成させたカレーを全員で囲んだ笑顔ショット。" }
        ];

        const missionsData = {
            "A": commonMissions,
            "B": commonMissions,
            "C": commonMissions,
            "D": commonMissions
        };

        const carSelect = document.getElementById('carSelect');
        const counterDisplay = document.getElementById('counter');
        const shutterBtn = document.getElementById('shutter');
        const shutterContainer = document.getElementById('shutterContainer');
        const guideTitle = document.getElementById('guide-title');
        const statusMsg = document.getElementById('status-msg');
        const flashBtn = document.getElementById('flashBtn');
        const timerBtn = document.getElementById('timerBtn');
        const powerBtn = document.getElementById('powerBtn');
        
        let selectedCar = localStorage.getItem('curry_team') || "";
        let shotCount = 0;
        let isFlashOn = false, isCameraOn = false, isTimerActive = false, isCapturing = false;
        let currentFacingMode = "environment";
        let resetClickCount = 0;

        window.onload = () => {
            if (selectedCar) {
                carSelect.value = selectedCar;
                carSelect.disabled = true;
                loadCount();
            }
            startCamera();
            updateUI();
        };

        function loadCount() {
            if (!selectedCar) return;
            shotCount = parseInt(localStorage.getItem(`curry_count_${selectedCar}`)) || 0;
        }

        function updateUI() {
            if (!selectedCar) {
                counterDisplay.innerText = MAX_SHOTS;
                guideTitle.innerText = "グループを選択してください";
                shutterBtn.disabled = true;
                return;
            }
            const remaining = MAX_SHOTS - shotCount;
            counterDisplay.innerText = remaining > 0 ? remaining : 0;
            const mList = missionsData[selectedCar];
            const current = mList.find(m => remaining > m.threshold);
            guideTitle.innerText = current ? current.title : "ミッション完了！";
            shutterBtn.disabled = (isCapturing || remaining <= 0 || !isCameraOn);
        }

        carSelect.onchange = () => {
            if (carSelect.value) {
                selectedCar = carSelect.value;
                localStorage.setItem('curry_team', selectedCar);
                carSelect.disabled = true;
                loadCount();
                updateUI();
            }
        };

        async function startCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                const videoEl = document.getElementById('video');
                videoEl.srcObject = stream;
                videoEl.classList.toggle('selfie', currentFacingMode === "user");
                isCameraOn = true;
                powerBtn.innerText = "📷 CAMERA OFF";
                powerBtn.classList.add('active-state');
                updateUI();
                if (isFlashOn) setTimeout(() => applyTorch(true), 1000);
            } catch (e) {
                statusMsg.innerText = "CAMERA ERROR";
                console.error(e);
            }
        }

        async function applyTorch(state) {
            if (!stream || currentFacingMode === "user") return;
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                try { await track.applyConstraints({ advanced: [{ torch: state }] }); } catch (err) {}
            }
        }

        flashBtn.onclick = () => {
            if (currentFacingMode === "user") return;
            isFlashOn = !isFlashOn;
            flashBtn.innerText = isFlashOn ? "⚡ FLASH ON" : "⚡ FLASH OFF";
            flashBtn.classList.toggle('active-state', isFlashOn);
            applyTorch(isFlashOn);
        };

        document.getElementById('switchBtn').onclick = () => {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            startCamera();
        };

        timerBtn.onclick = () => {
            isTimerActive = !isTimerActive;
            timerBtn.classList.toggle('active-state', isTimerActive);
        };

        powerBtn.onclick = () => {
            if (isCameraOn) {
                if (stream) stream.getTracks().forEach(t => t.stop());
                isCameraOn = false;
                powerBtn.innerText = "📷 CAMERA ON";
                powerBtn.classList.remove('active-state');
            } else {
                startCamera();
            }
            updateUI();
        };

        document.getElementById('zoomRange').oninput = (e) => {
            document.getElementById('video').style.setProperty('--zoom-level', e.target.value);
        };

        shutterBtn.onclick = () => {
            if (isCapturing || shutterBtn.disabled) return;
            isCapturing = true;
            shutterBtn.disabled = true;

            if (isTimerActive) {
                let c = 5;
                const timerDisp = document.getElementById('timer-display');
                timerDisp.innerText = c;
                timerDisp.style.visibility = "visible";
                const itv = setInterval(() => {
                    c--;
                    if (c > 0) {
                        timerDisp.innerText = c;
                    } else {
                        clearInterval(itv);
                        timerDisp.style.visibility = "hidden";
                        executeCapture();
                        isTimerActive = false;
                        timerBtn.classList.remove('active-state');
                    }
                }, 1000);
            } else {
                executeCapture();
            }
        };

        function executeCapture() {
            takePicture();
            statusMsg.innerText = "CHARGING...";
            statusMsg.classList.add('charging');
            shutterContainer.classList.add('is-charging');

            setTimeout(() => {
                isCapturing = false;
                statusMsg.innerText = "READY";
                statusMsg.classList.remove('charging');
                shutterContainer.classList.remove('is-charging');
                updateUI();
            }, 3000);
        }

        function takePicture() {
            const targetW = 1800, targetH = 1200; // 3:2比率
            const canvas = document.getElementById('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            const v = document.getElementById('video');
            const vw = v.videoWidth, vh = v.videoHeight;
            const zoom = parseFloat(document.getElementById('zoomRange').value);

            let sH = vh / zoom, sW = (sH * 1.5);
            if (sW > vw) { sW = vw / zoom; sH = sW / 1.5; }
            const sX = (vw - sW) / 2, sY = (vh - sH) / 2;

            ctx.drawImage(v, sX, sY, sW, sH, 0, 0, targetW, targetH);
            applyEffects(ctx, targetW, targetH);
            addStamps(ctx, targetW, targetH);

            // 1MB前後に最適化（品質0.82）
            canvas.toBlob(async (blob) => {
                const now = new Date();
                const timeStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
                const mList = missionsData[selectedCar];
                const mID = (mList.find(m => (MAX_SHOTS - shotCount) > m.threshold) || {id:"99"}).id;
                const fileName = `curry_team${selectedCar}_${mID}_${timeStr}.jpg`;

                if (db) {
                    const tx = db.transaction(storeName, "readwrite");
                    tx.objectStore(storeName).add({ blob, fileName });
                }

                shotCount++;
                localStorage.setItem(`curry_count_${selectedCar}`, shotCount);

                const remaining = MAX_SHOTS - shotCount;
                counterDisplay.innerText = remaining > 0 ? remaining : 0;
                syncPhotos();
            }, 'image/jpeg', 0.82);
        }

        async function syncPhotos() {
            if (!navigator.onLine || !db || !storage) return;
            const store = db.transaction(storeName, "readwrite").objectStore(storeName);
            const req = store.getAll();
            req.onsuccess = async () => {
                const items = req.result;
                for (const item of items) {
                    try {
                        await uploadBytes(ref(storage, `photos/${item.fileName}`), item.blob);
                        db.transaction(storeName, "readwrite").objectStore(storeName).delete(item.id);
                    } catch (e) { break; }
                }
            };
        }

        function applyEffects(ctx, w, h) {
            // スパイス・アンバー レトロトーン
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255, 150, 0, 0.12)'; 
            ctx.fillRect(0, 0, w, h);
            
            ctx.fillStyle = isFlashOn ? 'rgba(255, 255, 255, 0.22)' : 'rgba(255, 180, 50, 0.14)'; 
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';

            // グレインノイズ
            const grain = (w * h) / 1.6;
            for (let i = 0; i < grain; i++) {
                const x = Math.random() * w, y = Math.random() * h, opacity = Math.random() * 0.07;
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`; 
                ctx.fillRect(x, y, 1.2, 1.2);
            }

            // 周辺光量落ち (ヴィネット)
            const g = ctx.createRadialGradient(w/2, h/2, w/4, w/2, h/2, w/0.8);
            g.addColorStop(0, 'transparent'); 
            g.addColorStop(1, 'rgba(0,0,0,0.65)');
            ctx.fillStyle = g; 
            ctx.fillRect(0, 0, w, h);
        }

        function addStamps(ctx, w, h) {
            const n = new Date();
            const dateStr = `'${n.getFullYear().toString().slice(-2)}.${String(n.getMonth()+1).padStart(2,'0')}.${String(n.getDate()).padStart(2,'0')} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
            const teamStr = `TEAM-${selectedCar} (CURRY GP)`;
            const fs = Math.floor(w * 0.045);

            ctx.font = `bold ${fs}px "Courier New", monospace`;
            ctx.textAlign = "right";
            ctx.globalAlpha = 0.75;
            ctx.lineWidth = fs/8;
            ctx.strokeStyle = "rgba(0,0,0,0.55)";

            ctx.strokeText(dateStr, w*0.95, h*0.95);
            ctx.fillStyle = "#ff9f1a";
            ctx.fillText(dateStr, w*0.95, h*0.95);

            ctx.textAlign = "left";
            ctx.strokeText(teamStr, w*0.05, h*0.95);
            ctx.fillText(teamStr, w*0.05, h*0.95);
            ctx.globalAlpha = 1.0;
        }

        // 5連打リセット
        document.getElementById('resetTrigger').onclick = () => {
            resetClickCount++;
            if (resetClickCount >= 5) {
                if(confirm("全リセット（グループ選択・撮影枚数の初期化）を行いますか？")) {
                    localStorage.clear();
                    shotCount = 0;
                    selectedCar = "";
                    carSelect.disabled = false;
                    carSelect.value = "";
                    updateUI();
                }
                resetClickCount = 0;
            }
            setTimeout(() => { resetClickCount = 0; }, 2000);
        };

        // ミッションモーダル開閉
        const modal = document.getElementById('mission-overlay');
        document.getElementById('missionBtn').onclick = () => {
            const currentTeam = selectedCar || "A";
            const list = document.getElementById('mission-list-content');
            list.innerHTML = "";
            document.getElementById('modal-team-name').innerText = `TEAM ${currentTeam} - MISSION LIST`;
            missionsData[currentTeam].forEach(m => {
                const div = document.createElement('div');
                div.className = "mission-item-card";
                div.innerHTML = `<div class="mission-head" style="color:var(--accent)">MISSION ${m.id}: ${m.title}</div><p class="mission-desc">${m.task}</p>`;
                list.appendChild(div);
            });
            modal.style.display = "block";
        };

        modal.onclick = (e) => {
            if (e.target === modal || e.target.id === 'modalCloseBtn') {
                modal.style.display = "none";
            }
        };

        window.addEventListener('online', syncPhotos);
    </script>
</body>
</html>

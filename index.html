<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CURRY × PHOTO GP 2026 ポータル</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --surface-card: rgba(26, 31, 42, 0.85);
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ff9f1a;
            --text-main: #f0f3f6;
            --text-sub: #8a94a6;
            --danger: #ff4757;
            --success: #2ed573;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px 16px 40px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hero {
            text-align: center;
            padding: 16px 0 8px 0;
        }
        .hero-tag {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .hero-title {
            font-size: 24px;
            font-weight: 900;
            margin: 6px 0 0 0;
            background: linear-gradient(135deg, #fff 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* パスコード解除カード */
        .unlock-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 14px 16px;
        }
        .unlock-input-group {
            display: flex;
            gap: 8px;
        }
        .unlock-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            padding: 8px 12px;
            outline: none;
        }
        .unlock-input:focus { border-color: var(--accent-color); }
        .btn-unlock {
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            padding: 0 16px;
            cursor: pointer;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid var(--surface-border);
            color: var(--text-sub);
            border-radius: 6px;
            font-size: 11px;
            padding: 4px 8px;
            cursor: pointer;
        }
        .unlock-msg {
            font-size: 11px;
            margin-top: 6px;
            min-height: 15px;
            text-align: center;
        }

        /* メニュー一覧 */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.15s ease;
        }
        .menu-item:active { transform: scale(0.98); }
        .menu-item.highlight {
            border-color: rgba(255, 159, 26, 0.4);
            background: linear-gradient(135deg, rgba(255, 159, 26, 0.12), rgba(26, 31, 42, 0.9));
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-icon { font-size: 24px; }
        .menu-info { display: flex; flex-direction: column; gap: 2px; }
        .menu-title { font-size: 14px; font-weight: 800; }
        .menu-desc { font-size: 11px; color: var(--text-sub); }
        .menu-arrow { color: var(--text-sub); font-size: 14px; }

        /* 初期非表示エリア */
        .secret-menu {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero">
            <span class="hero-tag">AUTUMN SEMINAR 2026</span>
            <h1 class="hero-title">🍛 PHOTO × CURRY GP</h1>
        </div>

        <!-- パスコード入力欄（平文判定） -->
        <div class="unlock-card">
            <!-- 未解除時 -->
            <div id="unlockForm">
                <div class="unlock-input-group">
                    <input type="password" id="passInput" class="unlock-input" placeholder="パスワード入力" maxlength="8" inputmode="numeric">
                    <button class="btn-unlock" onclick="checkPassword()">表示</button>
                </div>
                <div id="unlockMsg" class="unlock-msg" style="color: var(--text-sub);">後半メニューを表示するにはパスワードを入力してください</div>
            </div>

            <!-- 解除後表示 -->
            <div id="unlockedStatus" style="display: none; align-items: center; justify-content: space-between;">
                <span style="font-size: 12px; font-weight: 700; color: var(--success);">🔓 全メニュー表示中</span>
                <button class="btn-reset" onclick="resetPassword()">隠す</button>
            </div>
        </div>

        <!-- メニュー一覧 -->
        <div class="menu-grid">
            <!-- 常時表示：カメラ -->
            <a href="camera.html" class="menu-item highlight">
                <div class="menu-left">
                    <span class="menu-icon">📷️</span>
                    <div class="menu-info">
                        <span class="menu-title">ミッションカメラ</span>
                        <span class="menu-desc">写ルンです風カメラでミッション撮影</span>
                    </div>
                </div>
                <span class="menu-arrow">▶</span>
            </a>

            <!-- 常時表示：取説 -->
            <a href="guide.html" class="menu-item">
                <div class="menu-left">
                    <span class="menu-icon">📖</span>
                    <div class="menu-info">
                        <span class="menu-title">イベント取扱説明書</span>
                        <span class="menu-desc">ルール・タイムスケジュール・操作ガイド</span>
                    </div>
                </div>
                <span class="menu-arrow">▶</span>
            </a>

            <!-- ★ パスワード「0120」で初めて姿を現すメニュー群 ★ -->
            <div id="secretMenu" class="secret-menu">
                <!-- 写真ギャラリー -->
                <a href="gallery.html" class="menu-item">
                    <div class="menu-left">
                        <span class="menu-icon">🖼️</span>
                        <div class="menu-info">
                            <span class="menu-title">提出写真ギャラリー</span>
                            <span class="menu-desc">各チームの写真一覧をリアルタイム閲覧</span>
                        </div>
                    </div>
                    <span class="menu-arrow">▶</span>
                </a>

                <!-- 表彰式・結果発表 -->
                <a href="results.html" class="menu-item">
                    <div class="menu-left">
                        <span class="menu-icon">🏆️</span>
                        <div class="menu-info">
                            <span class="menu-title">表彰式・結果発表</span>
                            <span class="menu-desc">リアルタイム集計グラフ＆受賞結果発表</span>
                        </div>
                    </div>
                    <span class="menu-arrow">▶</span>
                </a>

                <!-- フォトGP 投票 -->
                <a href="https://docs.google.com/forms/d/e/YOUR_PHOTO_FORM_ID/viewform" target="_blank" class="menu-item">
                    <div class="menu-left">
                        <span class="menu-icon">🗳️</span>
                        <div class="menu-info">
                            <span class="menu-title">フォトGP 投票</span>
                            <span class="menu-desc">最も心に刺さったベストショットに投票</span>
                        </div>
                    </div>
                    <span class="menu-arrow">▶</span>
                </a>

                <!-- カレーGP 投票 -->
                <a href="https://docs.google.com/forms/d/e/YOUR_CURRY_FORM_ID/viewform" target="_blank" class="menu-item">
                    <div class="menu-left">
                        <span class="menu-icon">🍛</span>
                        <div class="menu-info">
                            <span class="menu-title">カレーGP 審査投票</span>
                            <span class="menu-desc">味・アイデア・チームワークを審査採点</span>
                        </div>
                    </div>
                    <span class="menu-arrow">▶</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 平文パスワード
        const PASS = "0120";
        const STORAGE_KEY = "portal_menu_unlocked";

        window.onload = () => {
            // 前回復号済みであれば自動表示
            if (localStorage.getItem(STORAGE_KEY) === "true") {
                showSecretMenu();
            }
        };

        function checkPassword() {
            const input = document.getElementById('passInput').value.trim();
            const msg = document.getElementById('unlockMsg');

            if (input === PASS) {
                localStorage.setItem(STORAGE_KEY, "true");
                showSecretMenu();
                msg.innerText = "";
            } else {
                msg.innerText = "パスワードが正しくありません";
                msg.style.color = "var(--danger)";
            }
        }

        function showSecretMenu() {
            document.getElementById('secretMenu').style.display = "flex";
            document.getElementById('unlockForm').style.display = "none";
            document.getElementById('unlockedStatus').style.display = "flex";
        }

        function resetPassword() {
            localStorage.removeItem(STORAGE_KEY);
            document.getElementById('secretMenu').style.display = "none";
            document.getElementById('unlockForm').style.display = "block";
            document.getElementById('unlockedStatus').style.display = "none";
            document.getElementById('passInput').value = "";
            const msg = document.getElementById('unlockMsg');
            msg.innerText = "後半メニューを非表示にしました";
            msg.style.color = "var(--text-sub)";
        }

        // Enterキーで送信
        document.getElementById('passInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>

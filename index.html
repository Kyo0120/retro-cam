<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Curry Grand Prix - Modern Retro Cam</title>
    <style>
        :root {
            --bg-dark: #0c0f14;
            --panel-bg: rgba(22, 27, 34, 0.75);
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.35);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100dvh;
            width: 100dvw;
            overflow: hidden;
            flex-direction: row;
        }

        /* --- 左側：ファインダーエリア --- */
        .left-section {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
            padding: 12px;
            padding-left: max(16px, env(safe-area-inset-left));
        }

        #mission-guide {
            position: absolute;
            top: 14px;
            width: 88%;
            max-width: 380px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border-radius: var(--radius-md);
            padding: 8px 14px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .guide-label {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 2px;
        }
        .guide-title {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .viewfinder-container {
            width: min(100%, 360px);
            aspect-ratio: 3 / 2;
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 0 1px var(--border-glass), 0 20px 40px rgba(0, 0, 0, 0.8);
            background: #111;
        }
        /* ターゲットマーカー */
        .viewfinder-container::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32px; height: 32px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(var(--zoom-level, 1));
            transition: transform 0.1s ease-out;
        }
        video.selfie {
            transform: scale(var(--zoom-level, 1)) scaleX(-1);
        }

        #timer-display {
            visibility: hidden;
            position: absolute;
            font-size: 5.5rem;
            color: var(--accent);
            z-index: 20;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
        }

        /* --- 中央：コントロールパネル --- */
        .mid-section {
            width: 210px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-left: 1px solid var(--border-glass);
            border-right: 1px solid var(--border-glass);
            padding: 16px 12px;
        }

        .select-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 4px;
        }
        .car-select {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 600;
            width: 100%;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }
        .car-select:focus {
            border-color: var(--accent);
        }

        .sub-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sub-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }
        .sub-btn:active {
            transform: scale(0.97);
        }
        .active-mode {
            background: var(--accent) !important;
            color: #000 !important;
            border-color: var(--accent) !important;
            box-shadow: 0 0 14px var(--accent-glow);
        }

        .zoom-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }
        .zoom-label {
            font-size: 9px;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            accent-color: var(--accent);
            outline: none;
            cursor: pointer;
        }

        /* --- 右側：シャッター＆カウンターエリア --- */
        .right-section {
            width: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding-right: max(16px, env(safe-area-inset-right));
            gap: 16px;
        }

        .counter-badge {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 10px 22px;
            text-align: center;
            cursor: pointer;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .counter-badge:active {
            transform: scale(0.95);
        }
        .counter {
            font-size: 2.8rem;
            color: var(--accent);
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            text-shadow: 0 0 20px var(--accent-glow);
        }
        .counter-sub {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 1px;
            margin-top: 3px;
        }

        /* モダン二重リングシャッター */
        .shutter-outer {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        #shutter {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff3b30, #dc2626);
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        #shutter:active:not(:disabled) {
            transform: scale(0.9);
            box-shadow: 0 2px 6px rgba(220, 38, 38, 0.3);
        }
        #shutter:disabled {
            background: #27272a;
            box-shadow: none;
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* ステータスインジケーター */
        #status-pill {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-sub);
            z-index: 100;
            pointer-events: none;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }
        .status-dot.busy {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

        /* モーダル */
        #mission-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            display: none;
            padding: 24px;
            overflow-y: auto;
        }
        .modal-card {
            max-width: 480px;
            margin: 20px auto;
            background: #181d24;
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .mission-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 10px;
        }
        .mission-item-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .mission-item-task {
            font-size: 11px;
            color: var(--text-sub);
            line-height: 1.5;
            margin: 0;
        }
        canvas { display: none; }
    </style>
</head>
<body>

    <!-- ミッション一覧モーダル -->
    <div id="mission-overlay">
        <div class="modal-card">
            <h3 style="margin: 0 0 16px 0; font-size: 16px; letter-spacing: 0.5px; color: var(--accent); border-bottom: 1px solid var(--border-glass); padding-bottom: 10px;">
                🎯 MISSION LIST
            </h3>
            <div id="mission-list-content"></div>
            <p style="text-align: center; font-size: 11px; color: var(--text-sub); margin-top: 20px;">
                画面をタップして閉じる
            </p>
        </div>
    </div>

    <!-- 左エリア：ビューファインダー -->
    <div class="left-section">
        <div id="mission-guide">
            <div class="guide-label">CURRENT MISSION</div>
            <div id="guide-title" class="guide-title">グループを選択してください</div>
        </div>
        <div class="viewfinder-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <div id="timer-display">5</div>
    </div>

    <!-- 中央エリア：設定コントロール -->
    <div class="mid-section">
        <div class="select-group">
            <select id="carSelect" class="car-select">
                <option value="">グループを選択</option>
                <option value="A">グループ A</option>
                <option value="B">グループ B</option>
                <option value="C">グループ C</option>
                <option value="D">グループ D</option>
            </select>
        </div>
        <button class="sub-btn" id="missionBtn">📋 ミッション一覧</button>
        <button class="sub-btn" id="flashBtn">⚡ FLASH OFF</button>
        <button class="sub-btn" id="switchBtn">🔄 カメラ切替</button>
        <button class="sub-btn" id="powerBtn">📷 CAMERA ON</button>
        
        <div class="zoom-wrap">
            <div class="zoom-label"><span>ZOOM</span><span id="zoom-val">1.0x</span></div>
            <input type="range" id="zoomRange" min="1" max="3" step="0.1" value="1">
        </div>
    </div>

    <!-- 右エリア：シャッター ＆ カウンター -->
    <div class="right-section">
        <div class="counter-badge" id="resetTrigger" title="5回連続タップでリセット">
            <div class="counter" id="counter">20</div>
            <div class="counter-sub">REMAINING</div>
        </div>

        <div class="shutter-outer">
            <button id="shutter" disabled></button>
        </div>

        <button class="sub-btn" id="timerBtn" style="width: 140px;">⏱️ 5秒タイマー</button>
    </div>

    <!-- ステータスバー -->
    <div id="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-msg">READY</span>
    </div>

    <canvas id="canvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- Firebase設定（実際の情報を入力） ---
        const firebaseConfig = {
           apiKey: "AIzaSyDHqQDeEMrFV09YI0n_ARr1Tzta5aqmE2U",
            authDomain: "my-retro-cam.firebaseapp.com",
            projectId: "my-retro-cam",
            storageBucket: "my-retro-cam.firebasestorage.app",
            messagingSenderId: "700098109654",
            appId: "1:700098109654:web:9d679cbd092c1376642977""
        };
        
        let app, storage, auth;
        let isAuthReady = false;
        if (firebaseConfig.apiKey) {
            app = initializeApp(firebaseConfig);
            storage = getStorage(app);
            auth = getAuth(app);
            onAuthStateChanged(auth, (u) => { if(u) { isAuthReady=true; syncPhotos(); } else signInAnonymously(auth); });
        }

        const dbName = "CurryGrandPrixDB";
        const storeName = "photoQueue";
        let db, stream = null;
        const dbRequest = indexedDB.open(dbName, 1);
        dbRequest.onupgradeneeded = e => e.target.result.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
        dbRequest.onsuccess = e => { db = e.target.result; syncPhotos(); };

        const MAX_SHOTS = 20;

        // --- 全チーム共通ミッション（散策①と②入れ替え済み） ---
        const commonMissions = [
            { id: "01", threshold: 17, title: "1.集合：【決起集会】", task: "優勝を誓うガッツポーズ集合写真！" },
            { id: "02", threshold: 14, title: "2.買い出し：【目利きの極意】", task: "極上スパイスや隠し味を真剣に見極める姿。" },
            { id: "03", threshold: 10, title: "3.会場散策①：【放課後の記憶】", task: "廃校の長い廊下や教室、黒板を背にしたノスタルジーな青春の1枚。" },
            { id: "04", threshold: 7,  title: "4.会場散策②：【偵察部隊】", task: "ライバルチームを遠巻きに観察・警戒する姿。" },
            { id: "05", threshold: 3,  title: "5.調理中：【シェフの神業】", task: "ルーを投入する瞬間や躍動感ある鍋振り！" },
            { id: "06", threshold: 0,  title: "6.BBQ：【完成の歓喜】", task: "丹精込めて完成させたカレーを全員で囲んだ笑顔ショット。" }
        ];

        const missionsData = {
            "A": commonMissions,
            "B": commonMissions,
            "C": commonMissions,
            "D": commonMissions
        };

        const carSelect = document.getElementById('carSelect');
        const counterDisplay = document.getElementById('counter');
        const shutterBtn = document.getElementById('shutter');
        const guideTitle = document.getElementById('guide-title');
        const statusMsg = document.getElementById('status-msg');
        const statusDot = document.getElementById('status-dot');
        const flashBtn = document.getElementById('flashBtn');
        const zoomVal = document.getElementById('zoom-val');
        
        let selectedCar = localStorage.getItem('curry_team') || "";
        let shotCount = 0;
        let isFlashOn = false, isCameraOn = false, isTimerActive = false, isCapturing = false;
        let currentFacingMode = "environment";
        let resetClickCount = 0;

        window.onload = () => {
            if (selectedCar) {
                carSelect.value = selectedCar;
                carSelect.disabled = true;
                loadCount();
            }
            startCamera();
            updateUI();
        };

        function loadCount() {
            if (!selectedCar) return;
            shotCount = parseInt(localStorage.getItem(`curry_count_${selectedCar}`)) || 0;
        }

        function updateUI() {
            if (!selectedCar) {
                counterDisplay.innerText = MAX_SHOTS;
                guideTitle.innerText = "グループを選択してください";
                shutterBtn.disabled = true;
                return;
            }
            const remaining = MAX_SHOTS - shotCount;
            counterDisplay.innerText = remaining > 0 ? remaining : 0;
            const mList = missionsData[selectedCar];
            const current = mList.find(m => remaining > m.threshold);
            guideTitle.innerText = current ? current.title : "ミッション完了！";
            shutterBtn.disabled = (isCapturing || remaining <= 0 || !isCameraOn);
        }

        carSelect.onchange = () => {
            if (carSelect.value) {
                selectedCar = carSelect.value;
                localStorage.setItem('curry_team', selectedCar);
                carSelect.disabled = true;
                loadCount();
                updateUI();
            }
        };

        async function startCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                document.getElementById('video').srcObject = stream;
                isCameraOn = true;
                updateUI();
                if (isFlashOn) setTimeout(() => applyTorch(true), 1000);
            } catch (e) {
                statusMsg.innerText = "CAMERA ERROR";
            }
        }

        async function applyTorch(state) {
            if (!stream || currentFacingMode === "user") return;
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                try { await track.applyConstraints({ advanced: [{ torch: state }] }); } catch (err) {}
            }
        }

        flashBtn.onclick = () => {
            if (currentFacingMode === "user") return;
            isFlashOn = !isFlashOn;
            flashBtn.innerText = isFlashOn ? "⚡ FLASH ON" : "⚡ FLASH OFF";
            flashBtn.classList.toggle('active-mode', isFlashOn);
            applyTorch(isFlashOn);
        };

        document.getElementById('switchBtn').onclick = () => {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            startCamera();
        };

        document.getElementById('timerBtn').onclick = () => {
            isTimerActive = !isTimerActive;
            document.getElementById('timerBtn').classList.toggle('active-mode', isTimerActive);
        };

        document.getElementById('powerBtn').onclick = () => {
            if (isCameraOn) {
                if (stream) stream.getTracks().forEach(t => t.stop());
                isCameraOn = false;
                document.getElementById('powerBtn').innerText = "📷 CAMERA OFF";
            } else {
                startCamera();
                document.getElementById('powerBtn').innerText = "📷 CAMERA ON";
            }
            updateUI();
        };

        document.getElementById('zoomRange').oninput = (e) => {
            const val = e.target.value;
            zoomVal.innerText = `${parseFloat(val).toFixed(1)}x`;
            document.getElementById('video').style.setProperty('--zoom-level', val);
        };

        shutterBtn.onclick = () => {
            if (isCapturing || shutterBtn.disabled) return;
            isCapturing = true;
            shutterBtn.disabled = true;

            if (isTimerActive) {
                let c = 5;
                const timerDisp = document.getElementById('timer-display');
                timerDisp.innerText = c;
                timerDisp.style.visibility = "visible";
                const itv = setInterval(() => {
                    c--;
                    if (c > 0) {
                        timerDisp.innerText = c;
                    } else {
                        clearInterval(itv);
                        timerDisp.style.visibility = "hidden";
                        executeCapture();
                        isTimerActive = false;
                        document.getElementById('timerBtn').classList.remove('active-mode');
                    }
                }, 1000);
            } else {
                executeCapture();
            }
        };

        function executeCapture() {
            takePicture();
            statusMsg.innerText = "CHARGING...";
            statusDot.classList.add('busy');

            setTimeout(() => {
                isCapturing = false;
                statusMsg.innerText = "READY";
                statusDot.classList.remove('busy');
                updateUI();
            }, 3000);
        }

        function takePicture() {
            // 1MB前後に最適化された解像度 (1800 x 1200)
            const targetW = 1800, targetH = 1200;
            const canvas = document.getElementById('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            const v = document.getElementById('video');
            const vw = v.videoWidth, vh = v.videoHeight;
            const zoom = parseFloat(document.getElementById('zoomRange').value);

            let sH = vh / zoom, sW = (sH * 1.5);
            if (sW > vw) { sW = vw / zoom; sH = sW / 1.5; }
            const sX = (vw - sW) / 2, sY = (vh - sH) / 2;

            ctx.drawImage(v, sX, sY, sW, sH, 0, 0, targetW, targetH);
            applyEffects(ctx, targetW, targetH);
            addStamps(ctx, targetW, targetH);

            // 品質0.82で約1MB前後に落ち着く設定
            canvas.toBlob(async (blob) => {
                const now = new Date();
                const timeStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
                const mList = missionsData[selectedCar];
                const mID = (mList.find(m => (MAX_SHOTS - shotCount) > m.threshold) || {id:"99"}).id;
                const fileName = `curry_team${selectedCar}_${mID}_${timeStr}.jpg`;

                if (db) {
                    const tx = db.transaction(storeName, "readwrite");
                    tx.objectStore(storeName).add({ blob, fileName });
                }

                shotCount++;
                localStorage.setItem(`curry_count_${selectedCar}`, shotCount);

                const remaining = MAX_SHOTS - shotCount;
                counterDisplay.innerText = remaining > 0 ? remaining : 0;
                syncPhotos();
            }, 'image/jpeg', 0.82);
        }

        async function syncPhotos() {
            if (!navigator.onLine || !db || !storage) return;
            const store = db.transaction(storeName, "readwrite").objectStore(storeName);
            const req = store.getAll();
            req.onsuccess = async () => {
                const items = req.result;
                for (const item of items) {
                    try {
                        await uploadBytes(ref(storage, `photos/${item.fileName}`), item.blob);
                        db.transaction(storeName, "readwrite").objectStore(storeName).delete(item.id);
                    } catch (e) { break; }
                }
            };
        }

        function applyEffects(ctx, w, h) {
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255, 140, 0, 0.12)'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = isFlashOn ? 'rgba(255, 255, 255, 0.2)' : 'rgba(255, 200, 60, 0.12)'; ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';

            const grain = (w * h) / 1.6;
            for (let i = 0; i < grain; i++) {
                const x = Math.random() * w, y = Math.random() * h, opacity = Math.random() * 0.08;
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`; ctx.fillRect(x, y, 1.2, 1.2);
            }

            const g = ctx.createRadialGradient(w/2, h/2, w/4, w/2, h/2, w/0.8);
            g.addColorStop(0, 'transparent'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        }

        function addStamps(ctx, w, h) {
            const n = new Date();
            const dateStr = `'${n.getFullYear().toString().slice(-2)}.${String(n.getMonth()+1).padStart(2,'0')}.${String(n.getDate()).padStart(2,'0')} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
            const teamStr = `TEAM-${selectedCar} (CURRY GP)`;
            const fs = Math.floor(w * 0.045);

            ctx.font = `bold ${fs}px "Courier New", monospace`;
            ctx.textAlign = "right";
            ctx.globalAlpha = 0.75;
            ctx.lineWidth = fs/8;
            ctx.strokeStyle = "rgba(0,0,0,0.5)";

            ctx.strokeText(dateStr, w*0.95, h*0.95);
            ctx.fillStyle = "#ff8c21";
            ctx.fillText(dateStr, w*0.95, h*0.95);

            ctx.textAlign = "left";
            ctx.strokeText(teamStr, w*0.05, h*0.95);
            ctx.fillText(teamStr, w*0.05, h*0.95);
            ctx.globalAlpha = 1.0;
        }

        // リセット機能（5回連続タップ）
        document.getElementById('resetTrigger').onclick = () => {
            resetClickCount++;
            if (resetClickCount >= 5) {
                if(confirm("全リセット（グループ・枚数クリア）しますか？")) {
                    localStorage.clear();
                    shotCount = 0;
                    selectedCar = "";
                    carSelect.disabled = false;
                    carSelect.value = "";
                    updateUI();
                }
                resetClickCount = 0;
            }
            setTimeout(() => { resetClickCount = 0; }, 2000);
        };

        // モーダル制御
        document.getElementById('missionBtn').onclick = () => {
            if (!selectedCar) return;
            const list = document.getElementById('mission-list-content');
            list.innerHTML = "";
            missionsData[selectedCar].forEach(m => {
                const div = document.createElement('div');
                div.className = "mission-item";
                div.innerHTML = `<div class="mission-item-title">MISSION ${m.id} : ${m.title}</div><p class="mission-item-task">${m.task}</p>`;
                list.appendChild(div);
            });
            document.getElementById('mission-overlay').style.display = "block";
        };
        document.getElementById('mission-overlay').onclick = () => document.getElementById('mission-overlay').style.display = "none";

        window.addEventListener('online', syncPhotos);
    </script>
</body>
</html>

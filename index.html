<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Curry Grand Prix - Neo Retro Cam</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --surface-bg: rgba(20, 24, 32, 0.78);
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ff9f1a;
            --accent-glow: rgba(255, 159, 26, 0.35);
            --text-main: #f0f3f6;
            --text-sub: #8a94a6;
            --danger: #ff4757;
            --danger-glow: rgba(255, 71, 87, 0.35);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
            display: flex; height: 100dvh; width: 100dvw;
            overflow: hidden; flex-direction: row;
        }

        /* 左側：ビューファインダーセクション */
        .viewport-section {
            flex: 1.35;
            height: 100%;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            padding-left: max(16px, env(safe-area-inset-left));
        }

        .viewfinder-frame {
            width: 100%;
            max-width: 520px;
            aspect-ratio: 3 / 2;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 0 1px var(--surface-border), 0 20px 40px rgba(0,0,0,0.8);
            background: #050505;
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scale(var(--zoom-level, 1));
            transition: transform 0.1s ease-out;
        }
        video.selfie { transform: scale(var(--zoom-level, 1)) scaleX(-1); }

        .finder-crosshair {
            position: absolute; inset: 0; pointer-events: none;
            background: 
                linear-gradient(to right, transparent calc(50% - 0.5px), rgba(255,255,255,0.15) calc(50% - 0.5px), rgba(255,255,255,0.15) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
                linear-gradient(to bottom, transparent calc(50% - 0.5px), rgba(255,255,255,0.15) calc(50% - 0.5px), rgba(255,255,255,0.15) calc(50% + 0.5px), transparent calc(50% + 0.5px));
        }

        .mission-pill {
            position: absolute;
            top: 14px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 440px;
            background: rgba(13, 15, 18, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 159, 26, 0.3);
            border-radius: 10px;
            padding: 8px 14px;
            text-align: center;
            z-index: 20;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .mission-pill-label {
            font-size: 8px;
            letter-spacing: 1.5px;
            color: var(--accent-color);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .mission-pill-title {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mission-pill-task {
            font-size: 9.5px;
            color: #d1d5db;
            margin-top: 3px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .zoom-island {
            position: absolute;
            bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 17, 23, 0.7);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid var(--surface-border);
            z-index: 15;
        }
        .zoom-label { font-size: 10px; color: var(--text-sub); font-weight: 600; }
        .zoom-slider {
            -webkit-appearance: none; appearance: none;
            width: 100px; height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px; outline: none;
        }
        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-glow);
            cursor: pointer;
        }

        #timer-display {
            position: absolute; font-size: 5rem; font-weight: 800;
            color: var(--accent-color); text-shadow: 0 0 30px var(--accent-glow);
            z-index: 30; pointer-events: none; visibility: hidden;
        }

        /* 右側：コントロールセクション */
        .control-section {
            flex: 1.0;
            height: 100%;
            background: var(--surface-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--surface-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 18px;
            padding-right: max(18px, env(safe-area-inset-right));
            z-index: 10;
        }

        .deck-top {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        /* 大型プルダウン */
        .select-card {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .select-label { font-size: 9px; color: var(--text-sub); font-weight: 700; letter-spacing: 0.5px; }
        .car-select {
            width: 100%;
            height: 44px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--accent-color);
            border: 1px solid rgba(255, 159, 26, 0.3);
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            box-sizing: border-box;
        }
        .car-select option { background: #1a1d24; color: #fff; }

        .team-display-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 0.5px;
            display: none;
            padding: 6px 0;
        }

        .counter-card {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }
        .counter-label { font-size: 9.5px; color: var(--text-sub); font-weight: 700; letter-spacing: 0.5px; }
        .counter-badge {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-color);
            line-height: 1;
            font-feature-settings: "tnum";
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
            margin: 6px 0;
        }
        .action-tile {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 10px 4px;
            color: var(--text-main);
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .action-tile:active { transform: scale(0.97); }
        .action-tile.active {
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .full-width { grid-column: span 2; }

        .shutter-deck {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .shutter-ring {
            width: 74px; height: 74px;
            border-radius: 50%;
            background: transparent;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }
        .shutter-core {
            width: 58px; height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4757, #c0392b);
            border: none;
            outline: none;
            box-shadow: 0 4px 15px rgba(235, 47, 6, 0.4);
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .shutter-core:active { transform: scale(0.92); }
        .shutter-core:disabled {
            background: #2a2e38;
            box-shadow: none;
            opacity: 0.4;
            cursor: not-allowed;
        }

        .charging-indicator {
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        /* モーダル群 */
        .modal-layer {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-box {
            max-width: 480px; margin: 0 auto;
            background: #14171f;
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 20px;
        }

        .mission-item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            position: relative;
            transition: all 0.2s ease;
        }
        .mission-item-card.is-current {
            background: rgba(255, 159, 26, 0.08);
            border: 1.5px solid var(--accent-color);
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .current-badge {
            display: none;
            position: absolute;
            top: 10px; right: 12px;
            background: var(--accent-color);
            color: #000;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
        .mission-item-card.is-current .current-badge {
            display: inline-block;
        }

        #preview-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(16px);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .preview-card {
            background: #181b24;
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            max-width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        #preview-image {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 3 / 2;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }
        .preview-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* 5タップリセット専用確認モーダル */
        #reset-confirm-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(14px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-modal-box {
            background: #161922;
            border: 1px solid var(--danger);
            box-shadow: 0 10px 30px var(--danger-glow);
            border-radius: 14px;
            padding: 22px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .reset-modal-btns {
            display: flex; gap: 10px; margin-top: 20px;
        }
        .reset-btn-cancel {
            flex: 1; padding: 10px; background: rgba(255,255,255,0.08);
            border: 1px solid var(--surface-border); border-radius: 8px;
            color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .reset-btn-confirm {
            flex: 1; padding: 10px; background: var(--danger);
            border: none; border-radius: 8px;
            color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
        }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- リセット専用確認モーダル -->
    <div id="reset-confirm-modal">
        <div class="reset-modal-box">
            <h4 style="margin:0 0 10px 0; color:var(--danger); font-size:14px; letter-spacing:0.5px;">⚠️ グループ設定のリセット</h4>
            <p style="font-size:11px; color:#d1d5db; line-height:1.5; margin:0;">
                チーム設定および現在のカウントを初期化し、グループ再選択画面に戻りますか？
            </p>
            <div class="reset-modal-btns">
                <button id="resetCancelBtn" class="reset-btn-cancel">キャンセル</button>
                <button id="resetConfirmBtn" class="reset-btn-confirm">リセット実行</button>
            </div>
        </div>
    </div>

    <!-- 撮影プレビュー用モーダル（ミッション0限定） -->
    <div id="preview-modal">
        <div class="preview-card">
            <div style="font-size:12px; font-weight:bold; color:var(--accent-color); letter-spacing:1px;">TEST SHOT CHECK</div>
            <img id="preview-image" src="" alt="Test Preview">
            <button id="preview-confirm-btn" class="preview-btn">チェックOK</button>
        </div>
    </div>

    <!-- ミッション一覧モーダル -->
    <div id="mission-overlay" class="modal-layer">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--surface-border); padding-bottom:8px; margin-bottom:12px;">
                <h3 style="color:var(--accent-color); margin:0; font-size:13px; letter-spacing:1px;">MISSION LIST</h3>
                <span style="font-size:10px; color:var(--text-sub); cursor:pointer;">✕ 閉じる</span>
            </div>
            <div id="mission-list-content"></div>
            <p style="text-align:center; font-size:10px; color:var(--text-sub); margin-top:16px;">(画面のどこかをタップして閉じる)</p>
        </div>
    </div>

    <!-- 左側：ファインダー -->
    <section class="viewport-section">
        <div class="mission-pill">
            <div class="mission-pill-label">CURRENT MISSION</div>
            <div id="guide-title" class="mission-pill-title">グループを選択してください</div>
            <div id="guide-task" class="mission-pill-task"></div>
        </div>

        <div class="viewfinder-frame">
            <video id="video" autoplay playsinline></video>
            <div class="finder-crosshair"></div>
        </div>

        <div class="zoom-island">
            <span class="zoom-label">ZOOM</span>
            <input type="range" id="zoomRange" class="zoom-slider" min="1" max="3" step="0.1" value="1">
            <span id="zoomVal" style="font-size: 10px; color: var(--accent-color); font-weight: 700; min-width: 26px; text-align: right;">1.0x</span>
        </div>

        <div id="timer-display">5</div>
    </section>

    <!-- 右側：コントロールデッキ -->
    <section class="control-section">
        <div class="deck-top">
            <div class="select-card">
                <span class="select-label">TEAM</span>
                <select id="carSelect" class="car-select">
                    <option value="">グループを選択してください</option>
                    <option value="A">チームA</option>
                    <option value="B">チームB</option>
                    <option value="C">チームC</option>
                    <option value="D">チームD</option>
                </select>
                <div id="teamDisplayName" class="team-display-name"></div>
            </div>
            <div class="counter-card" id="resetTrigger">
                <span class="counter-label" id="counterLabel">🎞️残り枚数</span>
                <div class="counter-badge" id="counter">20</div>
            </div>
        </div>

        <div class="actions-grid">
            <button class="action-tile full-width" id="missionBtn">🗒️ミッション一覧</button>
            <button class="action-tile" id="flashBtn">`⚡️FLASH OFF</button>
            <button class="action-tile" id="switchBtn">📷️カメラ切替</button>
            <button class="action-tile" id="timerBtn">⌛️5秒タイマー</button>
            <button class="action-tile" id="powerBtn">↔️CAMERA ON</button>
        </div>

        <div class="shutter-deck">
            <div class="shutter-ring" id="shutterRing">
                <button id="shutter" class="shutter-core" disabled></button>
            </div>
            <div class="charging-indicator" id="status-msg">READY</div>
        </div>
    </section>

    <canvas id="canvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- Firebase設定（実際の値を貼り付けてください） ---
        const firebaseConfig = {
            apiKey: "AIzaSyDHqQDeEMrFV09YI0n_ARr1Tzta5aqmE2U",
            authDomain: "my-retro-cam.firebaseapp.com",
            projectId: "my-retro-cam",
            storageBucket: "my-retro-cam.firebasestorage.app",
            messagingSenderId: "700098109654",
            appId: "1:700098109654:web:9d679cbd092c1376642977"
        };
        
        let app, storage, auth;
        let isAuthReady = false;
        if (firebaseConfig.apiKey) {
            app = initializeApp(firebaseConfig);
            storage = getStorage(app);
            auth = getAuth(app);
            onAuthStateChanged(auth, (u) => { if(u) { isAuthReady=true; syncPhotos(); } else signInAnonymously(auth); });
        }

        const dbName = "CurryGrandPrixDB";
        const storeName = "photoQueue";
        let db, stream = null;
        const dbRequest = indexedDB.open(dbName, 1);
        dbRequest.onupgradeneeded = e => e.target.result.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
        dbRequest.onsuccess = e => { db = e.target.result; syncPhotos(); };

        const MAX_SHOTS = 20;

        const commonMissions = [
            { id: "00", threshold: 18, title: "0.操作練習：【テスト撮影】", task: "フラッシュやタイマー、構図を試してみよう！" },
            { id: "01", threshold: 15, title: "1.集合：【決起集会】", task: "優勝を誓うガッツポーズ集合写真！" },
            { id: "02", threshold: 12, title: "2.買い出し：【目利きの極意】", task: "極上スパイスや隠し味を真剣に見極める姿。" },
            { id: "03", threshold: 9,  title: "3.会場散策①：【放課後の記憶】", task: "廃校の長い廊下や教室、黒板を背にしたノスタルジーな青春の1枚。" },
            { id: "04", threshold: 6,  title: "4.会場散策②：【偵察部隊】", task: "ライバルチームを遠巻きに観察・警戒する姿。" },
            { id: "05", threshold: 3,  title: "5.調理中：【シェフの神業】", task: "ルーを投入する瞬間や躍動感ある鍋振り！" },
            { id: "06", threshold: 0,  title: "6.BBQ：【完成の歓喜】", task: "丹精込めて完成させたカレーを全員で囲んだ笑顔ショット。" }
        ];

        const missionsData = {
            "A": commonMissions,
            "B": commonMissions,
            "C": commonMissions,
            "D": commonMissions
        };

        const carSelect = document.getElementById('carSelect');
        const teamDisplayName = document.getElementById('teamDisplayName');
        const counterDisplay = document.getElementById('counter');
        const counterLabel = document.getElementById('counterLabel');
        const shutterBtn = document.getElementById('shutter');
        const guideTitle = document.getElementById('guide-title');
        const guideTask = document.getElementById('guide-task');
        const statusMsg = document.getElementById('status-msg');
        const flashBtn = document.getElementById('flashBtn');
        const previewModal = document.getElementById('preview-modal');
        const previewImg = document.getElementById('preview-image');
        const previewConfirmBtn = document.getElementById('preview-confirm-btn');
        const resetModal = document.getElementById('reset-confirm-modal');
        
        let selectedCar = localStorage.getItem('curry_team') || "";
        let shotCount = 0;
        let isFlashOn = false, isCameraOn = false, isTimerActive = false, isCapturing = false;
        let currentFacingMode = "environment";
        let resetClickCount = 0;

        window.onload = () => {
            if (selectedCar) {
                applySelectedTeamUI(selectedCar);
                loadCount();
            }
            startCamera();
            updateUI();
        };

        function applySelectedTeamUI(teamKey) {
            carSelect.style.display = "none";
            teamDisplayName.style.display = "block";
            teamDisplayName.innerText = `チーム${teamKey}`;
        }

        function loadCount() {
            if (!selectedCar) return;
            shotCount = parseInt(localStorage.getItem(`curry_count_${selectedCar}`)) || 0;
        }

        function updateUI() {
            if (!selectedCar) {
                counterDisplay.innerText = MAX_SHOTS;
                counterLabel.innerText = "残り枚数";
                guideTitle.innerText = "グループを選択してください";
                guideTask.innerText = "";
                shutterBtn.disabled = true;
                return;
            }
            const remaining = MAX_SHOTS - shotCount;
            const mList = missionsData[selectedCar];

            if (remaining > 0) {
                // ミッション中
                counterDisplay.innerText = remaining;
                counterLabel.innerText = "残り枚数";
                const current = mList.find(m => remaining > m.threshold);
                if (current) {
                    guideTitle.innerText = current.title;
                    guideTask.innerText = current.task;
                }
            } else {
                // フリー撮影モード中
                counterDisplay.innerText = shotCount; // 撮影したトータル枚数を表示（21, 22...）
                counterLabel.innerText = "撮影枚数";
                guideTitle.innerText = "フリー撮影モード";
                guideTask.innerText = "全ミッション達成！自由に思い出を記録しよう！";
            }

            shutterBtn.disabled = (isCapturing || !isCameraOn);
        }

        carSelect.onchange = () => {
            if (carSelect.value) {
                selectedCar = carSelect.value;
                localStorage.setItem('curry_team', selectedCar);
                applySelectedTeamUI(selectedCar);
                loadCount();
                updateUI();
            }
        };

        async function startCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                document.getElementById('video').srcObject = stream;
                isCameraOn = true;
                updateUI();
                if (isFlashOn) setTimeout(() => applyTorch(true), 1000);
            } catch (e) {
                statusMsg.innerText = "CAMERA ERROR";
            }
        }

        async function applyTorch(state) {
            if (!stream || currentFacingMode === "user") return;
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                try { await track.applyConstraints({ advanced: [{ torch: state }] }); } catch (err) {}
            }
        }

        flashBtn.onclick = () => {
            if (currentFacingMode === "user") return;
            isFlashOn = !isFlashOn;
            flashBtn.innerText = isFlashOn ? "FLASH ON" : "FLASH OFF";
            flashBtn.classList.toggle('active', isFlashOn);
            applyTorch(isFlashOn);
        };

        document.getElementById('switchBtn').onclick = () => {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            startCamera();
        };

        document.getElementById('timerBtn').onclick = () => {
            isTimerActive = !isTimerActive;
            document.getElementById('timerBtn').classList.toggle('active', isTimerActive);
        };

        document.getElementById('powerBtn').onclick = () => {
            if (isCameraOn) {
                if (stream) stream.getTracks().forEach(t => t.stop());
                isCameraOn = false;
            } else {
                startCamera();
            }
            updateUI();
        };

        document.getElementById('zoomRange').oninput = (e) => {
            const val = parseFloat(e.target.value).toFixed(1);
            document.getElementById('video').style.setProperty('--zoom-level', val);
              document.getElementById('zoomVal').innerText = `${val}x`;
        };
        
        shutterBtn.onclick = () => {
            if (isCapturing || shutterBtn.disabled) return;
            isCapturing = true;
            shutterBtn.disabled = true;

            if (isTimerActive) {
                let c = 5;
                const timerDisp = document.getElementById('timer-display');
                timerDisp.innerText = c;
                timerDisp.style.visibility = "visible";
                const itv = setInterval(() => {
                    c--;
                    if (c > 0) {
                        timerDisp.innerText = c;
                    } else {
                        clearInterval(itv);
                        timerDisp.style.visibility = "hidden";
                        executeCapture();
                        isTimerActive = false;
                        document.getElementById('timerBtn').classList.remove('active');
                    }
                }, 1000);
            } else {
                executeCapture();
            }
        };

        function executeCapture() {
            takePicture();
            statusMsg.innerText = "CHARGING...";
            setTimeout(() => {
                isCapturing = false;
                statusMsg.innerText = "READY";
                updateUI();
            }, 3000);
        }

        function takePicture() {
            const targetW = 1800, targetH = 1200;
            const canvas = document.getElementById('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            const v = document.getElementById('video');
            const vw = v.videoWidth, vh = v.videoHeight;
            const zoom = parseFloat(document.getElementById('zoomRange').value);

            let sH = vh / zoom, sW = (sH * 1.5);
            if (sW > vw) { sW = vw / zoom; sH = sW / 1.5; }
            const sX = (vw - sW) / 2, sY = (vh - sH) / 2;

            ctx.drawImage(v, sX, sY, sW, sH, 0, 0, targetW, targetH);
            applyEffects(ctx, targetW, targetH);

            const remainingBeforeShot = MAX_SHOTS - shotCount;
            const isPracticeMission = (remainingBeforeShot > 18);
            const isFreeMode = (remainingBeforeShot <= 0);

            let currentMissionId = "free";
            if (!isFreeMode) {
                const mList = missionsData[selectedCar];
                currentMissionId = (mList.find(m => remainingBeforeShot > m.threshold) || { id: "99" }).id;
            }

            addStamps(ctx, targetW, targetH, currentMissionId, isFreeMode);

            canvas.toBlob(async (blob) => {
                const now = new Date();
                const timeStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
                const fileName = `curry_team${selectedCar}_${currentMissionId}_${timeStr}.jpg`;

                if (db) {
                    const tx = db.transaction(storeName, "readwrite");
                    tx.objectStore(storeName).add({ blob, fileName });
                }

                shotCount++;
                localStorage.setItem(`curry_count_${selectedCar}`, shotCount);

                updateUI();
                syncPhotos();

                if (isPracticeMission) {
                    const previewUrl = URL.createObjectURL(blob);
                    previewImg.src = previewUrl;
                    previewModal.style.display = "flex";

                    previewConfirmBtn.onclick = () => {
                        previewModal.style.display = "none";
                        previewImg.src = "";
                        URL.revokeObjectURL(previewUrl);
                    };
                }
            }, 'image/jpeg', 0.80);
        }

        async function syncPhotos() {
            if (!navigator.onLine || !db || !isAuthReady || !storage) return;
            const store = db.transaction(storeName, "readwrite").objectStore(storeName);
            const req = store.getAll();
            req.onsuccess = async () => {
                const items = req.result;
                for (const item of items) {
                    try {
                        await uploadBytes(ref(storage, `photos/${item.fileName}`), item.blob);
                        db.transaction(storeName, "readwrite").objectStore(storeName).delete(item.id);
                    } catch (e) { break; }
                }
            };
        }

        function applyEffects(ctx, w, h) {
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255, 140, 0, 0.12)'; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = isFlashOn ? 'rgba(255, 255, 255, 0.2)' : 'rgba(255, 200, 60, 0.12)'; ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';

            const grain = (w * h) / 1.6;
            for (let i = 0; i < grain; i++) {
                const x = Math.random() * w, y = Math.random() * h, opacity = Math.random() * 0.08;
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`; ctx.fillRect(x, y, 1.2, 1.2);
            }

            const g = ctx.createRadialGradient(w/2, h/2, w/4, w/2, h/2, w/0.8);
            g.addColorStop(0, 'transparent'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        }

        // スタンプ：左下に「チーム名 ミッション:01」、右下に「YYYY.MM.DD HH:mm」
        function addStamps(ctx, w, h, mId, isFree) {
            const n = new Date();
            const year = n.getFullYear();
            const month = String(n.getMonth() + 1).padStart(2, '0');
            const day = String(n.getDate()).padStart(2, '0');
            const hours = String(n.getHours()).padStart(2, '0');
            const minutes = String(n.getMinutes()).padStart(2, '0');

            const dateStr = `${year}.${month}.${day} ${hours}:${minutes}`;
            const missionLabel = isFree ? "ミッション:フリーモード" : `ミッション:${mId}`;
            const leftText = `チーム${selectedCar} ${missionLabel}`;
            
            const fs = Math.floor(w * 0.035);
            ctx.font = `bold ${fs}px "Courier New", "Hiragino Kaku Gothic ProN", sans-serif`;
            ctx.globalAlpha = 0.75;
            ctx.lineWidth = fs / 7;
            ctx.strokeStyle = "rgba(0,0,0,0.55)";
            ctx.fillStyle = "#ff8c21";

            // 左下
            ctx.textAlign = "left";
            ctx.strokeText(leftText, w * 0.04, h * 0.96);
            ctx.fillText(leftText, w * 0.04, h * 0.96);

            // 右下
            ctx.textAlign = "right";
            ctx.strokeText(dateStr, w * 0.96, h * 0.96);
            ctx.fillText(dateStr, w * 0.96, h * 0.96);

            ctx.globalAlpha = 1.0;
        }

        // 5回連続タップでリセット確認モーダルを表示
        document.getElementById('resetTrigger').onclick = () => {
            resetClickCount++;
            if (resetClickCount >= 5) {
                resetModal.style.display = "flex";
                resetClickCount = 0;
            }
            setTimeout(() => { resetClickCount = 0; }, 2000);
        };

        // リセットキャンセル
        document.getElementById('resetCancelBtn').onclick = () => {
            resetModal.style.display = "none";
        };

        // リセット実行
        document.getElementById('resetConfirmBtn').onclick = () => {
            localStorage.clear();
            shotCount = 0;
            selectedCar = "";
            carSelect.style.display = "block";
            carSelect.value = "";
            teamDisplayName.style.display = "none";
            teamDisplayName.innerText = "";
            resetModal.style.display = "none";
            updateUI();
        };

        // ミッション一覧モーダル表示
        document.getElementById('missionBtn').onclick = () => {
            if (!selectedCar) return;
            const list = document.getElementById('mission-list-content');
            list.innerHTML = "";

            const remaining = MAX_SHOTS - shotCount;
            const mList = missionsData[selectedCar];
            const currentMission = remaining > 0 ? mList.find(m => remaining > m.threshold) : null;
            const currentId = currentMission ? currentMission.id : null;

            mList.forEach(m => {
                const isCurrent = (m.id === currentId);
                const card = document.createElement('div');
                card.className = `mission-item-card ${isCurrent ? 'is-current' : ''}`;
                card.innerHTML = `
                    <span class="current-badge">CURRENT</span>
                    <div style="font-weight:700; font-size:11.5px; color:${isCurrent ? 'var(--accent-color)' : '#fff'};">
                        MISSION ${m.id}: ${m.title}
                    </div>
                    <p style="font-size:10px; color:${isCurrent ? '#f0f3f6' : '#9ca3af'}; margin:4px 0 0 0; line-height:1.4;">
                        ${m.task}
                    </p>
                `;
                list.appendChild(card);
            });
            document.getElementById('mission-overlay').style.display = "block";
        };

        // どこをタップしても確実に閉じる処理
        document.getElementById('mission-overlay').onclick = () => {
            document.getElementById('mission-overlay').style.display = "none";
        };

        window.addEventListener('online', syncPhotos);
    </script>
</body>
</html>

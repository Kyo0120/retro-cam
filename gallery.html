<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ギャラリー | カレーグランプリ</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --surface-bg: rgba(20, 24, 32, 0.85);
            --surface-card: rgba(26, 31, 42, 0.75);
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ff9f1a;
            --accent-glow: rgba(255, 159, 26, 0.35);
            --text-main: #f0f3f6;
            --text-sub: #9aa4b2;
            --free-color: #2ed573;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
            min-height: 100vh;
        }

        header {
            position: sticky; top: 0;
            background: rgba(11, 13, 16, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--surface-border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        .header-title { font-size: 15px; font-weight: 800; color: var(--accent-color); letter-spacing: 0.5px; }
        .reload-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--surface-border);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 16px; }

        /* チーム切り替えタブ */
        .team-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            color: var(--text-sub);
            padding: 12px 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* 統計バナー */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            color: var(--text-sub);
        }
        .status-count { color: var(--accent-color); font-weight: 800; font-size: 14px; }

        /* 画像グリッド */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }
        .photo-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .photo-card:active { transform: scale(0.98); }
        .photo-thumb {
            width: 100%;
            aspect-ratio: 3 / 2;
            object-fit: cover;
            background: #000;
            display: block;
        }
        .photo-meta {
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }
        .meta-mission {
            font-weight: 800;
            color: var(--accent-color);
        }
        .meta-mission.is-free { color: var(--free-color); }
        .meta-date { color: var(--text-sub); font-size: 10px; }

        /* 拡大モーダル */
        #photo-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(16px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            max-width: 95%; max-height: 90vh;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .modal-img {
            max-width: 100%; max-height: 75vh;
            border-radius: 10px; border: 1px solid var(--surface-border);
            object-fit: contain;
        }
        .modal-info { color: #fff; font-size: 12px; font-weight: 700; text-align: center; }

        .loading-text { text-align: center; padding: 40px; color: var(--text-sub); font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">📷 PHOTO GALLERY</div>
        <button class="reload-btn" id="reloadBtn">🔄 最新に更新</button>
    </header>

    <div class="container">
        <!-- チーム選択タブ -->
        <div class="team-tabs">
            <button class="tab-btn active" data-team="A">チームA</button>
            <button class="tab-btn" data-team="B">チームB</button>
            <button class="tab-btn" data-team="C">チームC</button>
            <button class="tab-btn" data-team="D">チームD</button>
        </div>

        <div class="status-bar">
            <span id="currentTeamLabel">チームAの撮影写真</span>
            <span>枚数: <span class="status-count" id="photoCount">0</span> 枚</span>
        </div>

        <!-- 写真一覧 -->
        <div class="gallery-grid" id="galleryGrid">
            <div class="loading-text">写真を読み込み中...</div>
        </div>
    </div>

    <!-- 拡大モーダル -->
    <div id="photo-modal" onclick="closeModal()">
        <div class="modal-content">
            <img id="modalImg" class="modal-img" src="" alt="Enlarged Photo">
            <div id="modalInfo" class="modal-info"></div>
            <div style="font-size:10px; color:var(--text-sub);">(タップして閉じる)</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // アプリ本体と同じ設定値
        const firebaseConfig = {
            apiKey: "AIzaSyDHqQDeEMrFV09YI0n_ARr1Tzta5aqmE2U",
            authDomain: "my-retro-cam.firebaseapp.com",
            projectId: "my-retro-cam",
            storageBucket: "my-retro-cam.firebasestorage.app",
            messagingSenderId: "700098109654",
            appId: "1:700098109654:web:9d679cbd092c1376642977"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const auth = getAuth(app);

        let allPhotos = [];
        let currentTeam = "A";

        // ミッション名辞書
        const missionNames = {
            "00": "0. 操作練習",
            "01": "1. 決起集会",
            "02": "2. 買い出し",
            "03": "3. 放課後散策",
            "04": "4. 偵察部隊",
            "05": "5. 調理神業",
            "06": "6. BBQ歓喜",
            "free": "フリー撮影"
        };

        // ミッションの並び順優先度（free は一番大きな数値にして最後に配置）
        const missionOrder = {
            "00": 0,
            "01": 1,
            "02": 2,
            "03": 3,
            "04": 4,
            "05": 5,
            "06": 6,
            "free": 999
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                fetchPhotos();
            } else {
                await signInAnonymously(auth);
            }
        });

        // Firebase Storageから全写真を取得
        async function fetchPhotos() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '<div class="loading-text">写真を取得しています...</div>';
            allPhotos = [];

            try {
                const listRef = ref(storage, 'photos');
                const res = await listAll(listRef);

                const promises = res.items.map(async (itemRef) => {
                    const name = itemRef.name;
                    const parts = name.replace('.jpg', '').split('_');
                    
                    let team = "OTHER";
                    let mission = "00";
                    let time = "";

                    if (parts.length >= 4) {
                        team = parts[1].replace('team', ''); // "A"
                        mission = parts[2];                  // "01" or "free"
                        time = parts[3];                     // "20261029-123000"
                    }

                    const url = await getDownloadURL(itemRef);
                    return { name, team, mission, time, url };
                });

                allPhotos = await Promise.all(promises);

                // 【並び順のロジック】
                // 1. ミッション番号順（00 -> 01 -> ... -> 06 -> free）
                // 2. 同じミッション内は撮影時刻順（昇順）
                allPhotos.sort((a, b) => {
                    const orderA = missionOrder[a.mission] !== undefined ? missionOrder[a.mission] : 500;
                    const orderB = missionOrder[b.mission] !== undefined ? missionOrder[b.mission] : 500;

                    if (orderA !== orderB) {
                        return orderA - orderB;
                    }
                    return a.time.localeCompare(b.time);
                });

                renderTeamPhotos();
            } catch (err) {
                grid.innerHTML = '<div class="loading-text" style="color:var(--danger);">写真の取得に失敗しました。<br>権限またはネットワークを確認してください。</div>';
            }
        }

        // 選択中チームの写真を描画
        function renderTeamPhotos() {
            const grid = document.getElementById('galleryGrid');
            const teamPhotos = allPhotos.filter(p => p.team === currentTeam);

            document.getElementById('photoCount').innerText = teamPhotos.length;
            document.getElementById('currentTeamLabel').innerText = `チーム${currentTeam} の撮影写真`;

            if (teamPhotos.length === 0) {
                grid.innerHTML = `<div class="loading-text">チーム${currentTeam} の写真はまだありません。</div>`;
                return;
            }

            grid.innerHTML = "";
            teamPhotos.forEach(p => {
                const card = document.createElement('div');
                card.className = "photo-card";

                const isFree = p.mission === "free";
                const mLabel = missionNames[p.mission] || `ミッション:${p.mission}`;

                // 日時フォーマット (20261029-123000 -> 10/29 12:30)
                let dateDisplay = "";
                if (p.time && p.time.length >= 13) {
                    dateDisplay = `${p.time.slice(4,6)}/${p.time.slice(6,8)} ${p.time.slice(9,11)}:${p.time.slice(11,13)}`;
                }

                card.innerHTML = `
                    <img class="photo-thumb" src="${p.url}" alt="${mLabel}" loading="lazy">
                    <div class="photo-meta">
                        <span class="meta-mission ${isFree ? 'is-free' : ''}">${mLabel}</span>
                        <span class="meta-date">${dateDisplay}</span>
                    </div>
                `;

                card.onclick = () => openModal(p.url, `チーム${p.team} | ${mLabel} (${dateDisplay})`);
                grid.appendChild(card);
            });
        }

        // タブ切り替え
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTeam = btn.getAttribute('data-team');
                renderTeamPhotos();
            };
        });

        // モーダル表示
        window.openModal = (url, info) => {
            document.getElementById('modalImg').src = url;
            document.getElementById('modalInfo').innerText = info;
            document.getElementById('photo-modal').style.display = "flex";
        };

        window.closeModal = () => {
            document.getElementById('photo-modal').style.display = "none";
        };

        document.getElementById('reloadBtn').onclick = fetchPhotos;
    </script>
</body>
</html>

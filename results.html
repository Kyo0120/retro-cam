<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>表彰式・結果発表 | CURRY × PHOTO GP</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --surface-bg: rgba(20, 24, 32, 0.88);
            --surface-card: rgba(26, 31, 42, 0.85);
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent-gold: #ffbe0b;
            --accent-gold-glow: rgba(255, 190, 11, 0.35);
            --curry-color: #ff5e3a;
            --curry-glow: rgba(255, 94, 58, 0.35);
            --photo-color: #00d2d3;
            --text-main: #f0f3f6;
            --text-sub: #8a94a6;
            --danger: #ff4757;
            --rank-1: linear-gradient(135deg, #ffd700, #ffae19);
            --rank-2: linear-gradient(135deg, #e0e0e0, #9e9e9e);
            --rank-3: linear-gradient(135deg, #cd7f32, #8d5524);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky; top: 0;
            background: rgba(11, 13, 16, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--surface-border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        .header-title { font-size: 15px; font-weight: 900; color: var(--accent-gold); letter-spacing: 0.5px; }
        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
        }

        .container {
            flex: 1;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 16px 40px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* タブ切り替え（フォトGP / カレーGP） */
        .tab-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--surface-border);
        }
        .tab-btn {
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active.photo {
            background: var(--photo-color);
            color: #000;
            box-shadow: 0 2px 12px rgba(0, 210, 211, 0.4);
        }
        .tab-btn.active.curry {
            background: var(--curry-color);
            color: #fff;
            box-shadow: 0 2px 12px var(--curry-glow);
        }

        .section-box {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 18px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--surface-border);
        }
        .section-title { font-size: 14px; font-weight: 900; letter-spacing: 0.5px; }

        /* ランキングリスト */
        .rank-list { display: flex; flex-direction: column; gap: 10px; }
        .rank-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .rank-card.top1 {
            border-color: rgba(255, 190, 11, 0.5);
            background: linear-gradient(135deg, rgba(255, 190, 11, 0.12), rgba(0,0,0,0.4));
        }
        .rank-left { display: flex; align-items: center; gap: 12px; }
        .rank-badge {
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 900; color: #000;
            background: var(--surface-border);
        }
        .rank-badge.r1 { background: var(--rank-1); }
        .rank-badge.r2 { background: var(--rank-2); }
        .rank-badge.r3 { background: var(--rank-3); }
        .rank-badge.r4 { background: #333; color: #aaa; }
        .team-name { font-size: 15px; font-weight: 800; }
        .score-box { text-align: right; }
        .main-score { font-size: 18px; font-weight: 900; color: var(--accent-gold); }
        .sub-score { font-size: 10px; color: var(--text-sub); }

        /* 部門賞バー */
        .category-group { margin-bottom: 14px; }
        .cat-title { font-size: 12px; font-weight: 800; color: var(--text-sub); margin-bottom: 6px; }
        .cat-bar-wrap {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 11px; margin-bottom: 4px;
        }
        .cat-progress {
            height: 7px; border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden; margin-bottom: 8px;
        }
        .cat-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }

        /* 審査員コメント */
        .comment-list {
            display: flex; flex-direction: column; gap: 8px;
            max-height: 220px; overflow-y: auto;
        }
        .comment-item {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11.5px;
            line-height: 1.4;
        }
        .comment-author { font-size: 9.5px; color: var(--text-sub); margin-bottom: 2px; }

        /* 🔒 認証ブロック */
        #authBlock {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }
        .loading-box { text-align: center; padding: 40px; color: var(--text-sub); font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">🏆️ 表彰式・結果発表</div>
        <a href="index.html" class="back-btn">ポータルへ</a>
    </header>

    <div class="container" id="mainContainer">
        <!-- タブ切り替え -->
        <div class="tab-switch">
            <button class="tab-btn active photo" id="photoTabBtn" onclick="switchTab('photo')">📷️ フォトGP</button>
            <button class="tab-btn" id="curryTabBtn" onclick="switchTab('curry')">🍛 カレーGP</button>
        </div>

        <div id="loadingBox" class="loading-box">
            スプレッドシートから集計データを取得中...
        </div>

        <!-- 結果表示エリア -->
        <div id="resultsContent" style="display: none; flex-direction: column; gap: 16px;">
            <!-- 総合ランキング -->
            <div class="section-box">
                <div class="section-header">
                    <span class="section-title" id="rankSectionTitle">👑 総合ランキング</span>
                    <span style="font-size: 10px; color: var(--text-sub);">最優秀票 ＋ 部門合計点</span>
                </div>
                <div class="rank-list" id="rankingList"></div>
            </div>

            <!-- 部門賞プレビュー -->
            <div class="section-box">
                <div class="section-header">
                    <span class="section-title">🎖️ 部門賞 得票状況</span>
                </div>
                <div id="categoryContainer"></div>
            </div>

            <!-- 審査員・参加者コメント -->
            <div class="section-box">
                <div class="section-header">
                    <span class="section-title">💬 投票コメント・講評</span>
                </div>
                <div class="comment-list" id="commentList"></div>
            </div>
        </div>

        <!-- 🔒 未認証・ブロック画面 -->
        <div id="authBlock">
            <div style="font-size: 48px; margin-bottom: 12px;">🔒</div>
            <h2 style="color: var(--danger); font-size: 18px; margin: 0 0 8px 0;">アクセス権がありません</h2>
            <p style="color: var(--text-sub); font-size: 12px; line-height: 1.6; margin-bottom: 24px;">
                このページを閲覧するには参加認証が必要です。<br>トップページ（ポータル）から正しいPINコードでアクセスしてください。
            </p>
            <a href="index.html" class="back-btn" style="padding: 10px 24px; font-size: 13px; background: var(--accent-gold); color: #000; border: none;">ポータルへ戻る</a>
        </div>
    </div>

    <script>
        // ★ ご自身のGASウェブアプリURLに差し替えてください ★
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxdc51YIhCJS3WE-6qJXNC8jPpeTazBYDTkflCYSBJeU3zN1jTU3ry2mGYYGLpXjiX8Iw/exec";

        let appData = null;
        let currentTab = "photo";

        async function initResults() {
            const pin = sessionStorage.getItem("event_user_pin");

            // 1. PINが存在しない場合は即ブロック
            if (!pin) {
                showBlocked();
                return;
            }

            try {
                // 2. GASへPINを渡して集計データを取得
                const res = await fetch(`${GAS_API_URL}?action=results&pin=${encodeURIComponent(pin)}`);
                const data = await res.json();

                if (!data.success) {
                    showBlocked();
                    return;
                }

                // 3. 認証成功：データを描画
                appData = data;
                document.getElementById('loadingBox').style.display = 'none';
                document.getElementById('resultsContent').style.display = 'flex';
                renderContent();

            } catch (err) {
                console.error("Results Fetch Error:", err);
                // GAS_API_URLが未設定の場合のデモフォールバック
                if (GAS_API_URL.includes("YOUR_DEPLOYMENT_ID")) {
                    renderDemoData();
                } else {
                    document.getElementById('loadingBox').innerText = "集計データの取得に失敗しました。";
                }
            }
        }

        function showBlocked() {
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('resultsContent').style.display = 'none';
            document.getElementById('authBlock').style.display = 'block';
        }

        function switchTab(tab) {
            currentTab = tab;
            const photoBtn = document.getElementById('photoTabBtn');
            const curryBtn = document.getElementById('curryTabBtn');

            if (tab === 'photo') {
                photoBtn.className = "tab-btn active photo";
                curryBtn.className = "tab-btn";
            } else {
                curryBtn.className = "tab-btn active curry";
                photoBtn.className = "tab-btn";
            }
            renderContent();
        }

        function renderContent() {
            if (!appData) return;
            const isPhoto = (currentTab === "photo");
            const dataSet = isPhoto ? appData.photo : appData.curry;
            const themeColor = isPhoto ? "var(--photo-color)" : "var(--curry-color)";

            // 1. 総合ランキング描画（整数切り捨て表示）
            const rankListEl = document.getElementById('rankingList');
            rankListEl.innerHTML = "";

            dataSet.ranking.forEach((item, idx) => {
                const rankNum = idx + 1;
                const grandVotes = item.grand || 0;
                // 表示用スコア：最優秀票（整数部）
                const displayScore = Math.floor(item.calcScore || grandVotes);

                const card = document.createElement('div');
                card.className = `rank-card ${rankNum === 1 ? 'top1' : ''}`;
                card.innerHTML = `
                    <div class="rank-left">
                        <div class="rank-badge r${rankNum}">${rankNum}</div>
                        <div class="team-name">${item.team}</div>
                    </div>
                    <div class="score-box">
                        <div class="main-score">${displayScore}<span style="font-size:11px; margin-left:2px;">票</span></div>
                        <div class="sub-score">最優秀 ${grandVotes} 票</div>
                    </div>
                `;
                rankListEl.appendChild(card);
            });

            // 2. 部門賞グラフ描画
            const catContainer = document.getElementById('categoryContainer');
            catContainer.innerHTML = "";

            const categories = isPhoto
                ? [ { key: "teamwork", name: "🤝 チームワーク賞" }, { key: "repro", name: "🎯 再現度賞" }, { key: "humor", name: "🤣 ユーモア賞" } ]
                : [ { key: "taste", name: "👅 味・完成度賞" }, { key: "orig", name: "💡 オリジナリティ賞" }, { key: "teamwork", name: "🤝 チームワーク賞" } ];

            categories.forEach(cat => {
                const teamVotes = dataSet.categories[cat.key] || [];
                const maxVote = Math.max(...teamVotes.map(t => t.votes), 1);

                let catHtml = `<div class="category-group"><div class="cat-title">${cat.name}</div>`;
                teamVotes.forEach(tv => {
                    const pct = Math.round((tv.votes / maxVote) * 100);
                    catHtml += `
                        <div class="cat-bar-wrap">
                            <span>${tv.team}</span>
                            <span style="font-weight:bold;">${tv.votes} 票</span>
                        </div>
                        <div class="cat-progress">
                            <div class="cat-bar" style="width: ${pct}%; background: ${themeColor};"></div>
                        </div>
                    `;
                });
                catHtml += `</div>`;
                catContainer.innerHTML += catHtml;
            });

            // 3. コメント一覧
            const commentListEl = document.getElementById('commentList');
            commentListEl.innerHTML = "";
            if (dataSet.comments && dataSet.comments.length > 0) {
                dataSet.comments.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'comment-item';
                    item.innerHTML = `
                        <div class="comment-author">${escapeHtml(c.user)}</div>
                        <div>${escapeHtml(c.text)}</div>
                    `;
                    commentListEl.appendChild(item);
                });
            } else {
                commentListEl.innerHTML = `<div style="text-align:center; color:var(--text-sub); font-size:11px; padding:10px;">コメントはまだありません</div>`;
            }
        }

        function escapeHtml(str) {
            return String(str || "").replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        function renderDemoData() {
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('resultsContent').style.display = 'flex';
            appData = {
                photo: {
                    ranking: [
                        { team: "チームA", calcScore: 12.015, grand: 12 },
                        { team: "チームB", calcScore: 8.020, grand: 8 },
                        { team: "チームC", calcScore: 5.010, grand: 5 },
                        { team: "チームD", calcScore: 3.008, grand: 3 }
                    ],
                    categories: {
                        teamwork: [{ team: "チームA", votes: 8 }, { team: "チームB", votes: 6 }, { team: "チームC", votes: 3 }, { team: "チームD", votes: 2 }],
                        repro: [{ team: "チームB", votes: 10 }, { team: "チームA", votes: 7 }, { team: "チームC", votes: 4 }, { team: "チームD", votes: 1 }],
                        humor: [{ team: "チームC", votes: 9 }, { team: "チームA", votes: 5 }, { team: "チームB", votes: 4 }, { team: "チームD", votes: 2 }]
                    },
                    comments: [{ user: "参加者", text: "チームAの再現度が素晴らしかった！" }]
                },
                curry: {
                    ranking: [
                        { team: "チームB", calcScore: 14.025, grand: 14 },
                        { team: "チームA", calcScore: 9.018, grand: 9 },
                        { team: "チームD", calcScore: 6.012, grand: 6 },
                        { team: "チームC", calcScore: 4.009, grand: 4 }
                    ],
                    categories: {
                        taste: [{ team: "チームB", votes: 12 }, { team: "チームA", votes: 7 }, { team: "チームD", votes: 4 }, { team: "チームC", votes: 2 }],
                        orig: [{ team: "チームD", votes: 10 }, { team: "チームB", votes: 8 }, { team: "チームA", votes: 5 }, { team: "チームC", votes: 3 }],
                        teamwork: [{ team: "チームA", votes: 9 }, { team: "チームB", votes: 7 }, { team: "チームC", votes: 5 }, { team: "チームD", votes: 4 }]
                    },
                    comments: [{ user: "審査員", text: "チームBのスパイス使いが本格的でした。" }]
                }
            };
            renderContent();
        }

        window.onload = initResults;
    </script>
</body>
</html>

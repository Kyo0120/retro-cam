<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>表彰式・結果発表 | カレーGP & フォトアワード</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --surface-bg: rgba(20, 24, 32, 0.85);
            --surface-card: rgba(26, 31, 42, 0.75);
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ff9f1a;
            --accent-glow: rgba(255, 159, 26, 0.4);
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --text-main: #f0f3f6;
            --text-sub: #9aa4b2;
            --curry-color: #ff6b4a;
            --curry-glow: rgba(255, 107, 74, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            position: sticky; top: 0;
            background: rgba(11, 13, 16, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--surface-border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        .header-title { font-size: 14px; font-weight: 800; color: var(--accent-color); letter-spacing: 0.5px; }
        .nav-links { display: flex; gap: 8px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--surface-border);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-btn.accent {
            color: var(--accent-color);
            border-color: rgba(255, 159, 26, 0.35);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 20px 16px 60px 16px; }

        .hero { text-align: center; margin-bottom: 20px; }
        .hero-badge {
            display: inline-block;
            background: rgba(255, 159, 26, 0.12);
            border: 1px solid rgba(255, 159, 26, 0.4);
            color: var(--accent-color);
            font-size: 10px; font-weight: 800;
            padding: 4px 12px; border-radius: 20px;
            letter-spacing: 1.5px; margin-bottom: 8px;
        }
        h1 { margin: 0 0 6px 0; font-size: 1.7rem; font-weight: 900; letter-spacing: -0.5px; }
        .hero-desc { font-size: 12px; color: var(--text-sub); }

        /* グランプリ切り替えタブ（ギャラリー風UI） */
        .gp-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }
        .gp-tab-btn {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            color: var(--text-sub);
            padding: 12px 0;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .gp-tab-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .gp-tab-btn.curry-tab.active {
            background: var(--curry-color);
            color: #fff;
            border-color: var(--curry-color);
            box-shadow: 0 4px 15px var(--curry-glow);
        }

        .section-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 22px;
            backdrop-filter: blur(12px);
        }
        .section-title {
            font-size: 13.5px; font-weight: 800; color: var(--accent-color);
            margin: 0 0 16px 0; display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--surface-border); padding-bottom: 10px;
        }
        .curry-mode .section-title { color: var(--curry-color); }

        /* ランキングカード */
        .ranking-list { display: flex; flex-direction: column; gap: 10px; }
        .rank-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .rank-card.rank-1 {
            border: 2px solid var(--gold);
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.12), rgba(0,0,0,0.4));
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.25);
        }
        .rank-card.rank-2 { border: 1.5px solid var(--silver); }
        .rank-card.rank-3 { border: 1.5px solid var(--bronze); }

        .rank-left { display: flex; align-items: center; gap: 14px; }
        .rank-num {
            font-size: 1.6rem; font-weight: 900; line-height: 1;
            font-family: "Courier New", monospace;
            width: 32px; text-align: center;
        }
        .rank-1 .rank-num { color: var(--gold); }
        .rank-2 .rank-num { color: var(--silver); }
        .rank-3 .rank-num { color: var(--bronze); }
        .rank-team { font-size: 15px; font-weight: 800; color: #fff; }
        .rank-breakdown { font-size: 10px; color: var(--text-sub); margin-top: 2px; }
        
        .rank-score-wrap { text-align: right; }
        .rank-score {
            font-size: 1.6rem; font-weight: 900; color: var(--accent-color);
            font-feature-settings: "tnum";
            font-family: "Courier New", monospace;
        }
        .curry-mode .rank-score { color: var(--curry-color); }
        .rank-unit { font-size: 11px; color: var(--text-sub); margin-left: 2px; font-weight: 700; }

        /* 個別部門賞 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .category-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 14px;
            border-top: 3px solid var(--accent-color);
        }
        .curry-mode .category-card { border-top-color: var(--curry-color); }
        .category-name { font-size: 11px; font-weight: 700; color: var(--text-sub); }
        .category-winner { font-size: 16px; font-weight: 900; color: #fff; margin: 4px 0 2px 0; }
        .category-votes { font-size: 11px; color: var(--accent-color); font-weight: 700; }
        .curry-mode .category-votes { color: var(--curry-color); }

        /* コメントリスト */
        .comment-grid { display: flex; flex-direction: column; gap: 10px; }
        .comment-bubble {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .comment-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; font-size: 10px; color: var(--text-sub);
        }
        .comment-user { font-weight: 800; color: var(--accent-color); }
        .curry-mode .comment-user { color: var(--curry-color); }
        .comment-body { font-size: 12px; color: #d1d5db; line-height: 1.5; margin: 0; }

        .view-panel { display: none; }
        .view-panel.active { display: block; }
        .loading-box { text-align: center; padding: 30px; color: var(--text-sub); font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">🏆 GRAND PRIX AWARDS</div>
        <div class="nav-links">
            <button class="nav-btn accent" id="refreshBtn">🔄 最新に更新</button>
            <a href="home.html" class="nav-btn">🏠️ Home</a>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <span class="hero-badge">RESULTS DASHBOARD</span>
            <h1 id="heroTitle">写真グランプリ 結果発表</h1>
            <div class="hero-desc" id="heroDesc">Google フォーム投票スプレッドシートからリアルタイム集計中</div>
        </div>

        <!-- グランプリ切り替えタブ -->
        <div class="gp-tabs">
            <button class="gp-tab-btn active" id="tabPhoto" onclick="switchView('photo')">
                📸 写真グランプリ
            </button>
            <button class="gp-tab-btn curry-tab" id="tabCurry" onclick="switchView('curry')">
                🍛 カレーグランプリ
            </button>
        </div>

        <!-- ================= ① 写真グランプリパネル ================= -->
        <div id="panelPhoto" class="view-panel active">
            <div class="section-card">
                <div class="section-title">🥇 写真総合ランキング（最優秀グランプリ）</div>
                <div class="ranking-list" id="photoRankingList">
                    <div class="loading-box">集計データを取得しています...</div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">🎖️ 写真 部門賞</div>
                <div class="category-grid" id="photoCategoryGrid">
                    <div class="loading-box">集計中...</div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">💬 写真グランプリ 投票メッセージ</div>
                <div class="comment-grid" id="photoCommentGrid">
                    <div class="loading-box">コメントを読み込み中...</div>
                </div>
            </div>
        </div>

        <!-- ================= ② カレーグランプリパネル ================= -->
        <div id="panelCurry" class="view-panel curry-mode">
            <div class="section-card">
                <div class="section-title">👑 カレー総合王座（初代カレージャンプ）</div>
                <div class="ranking-list" id="curryRankingList">
                    <div class="loading-box">集計データを取得しています...</div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">🎖️ カレー 部門賞</div>
                <div class="category-grid" id="curryCategoryGrid">
                    <div class="loading-box">集計中...</div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">💬 実食レビュー・応援コメント</div>
                <div class="comment-grid" id="curryCommentGrid">
                    <div class="loading-box">コメントを読み込み中...</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxlmHVIabVgeHkrWOReMoNZdNa5sOY8fdCFFOEiv8XKrB_MZFjMKF25Pw-CfOX_fT796w/exec";
        let activeTab = "photo";

        function switchView(tab) {
            activeTab = tab;
            const tabPhoto = document.getElementById('tabPhoto');
            const tabCurry = document.getElementById('tabCurry');
            const panelPhoto = document.getElementById('panelPhoto');
            const panelCurry = document.getElementById('panelCurry');
            const heroTitle = document.getElementById('heroTitle');

            if (tab === 'photo') {
                tabPhoto.classList.add('active');
                tabCurry.classList.remove('active');
                panelPhoto.classList.add('active');
                panelCurry.classList.remove('active');
                heroTitle.innerText = "写真グランプリ 結果発表";
            } else {
                tabPhoto.classList.remove('active');
                tabCurry.classList.add('active');
                panelPhoto.classList.remove('active');
                panelCurry.classList.add('active');
                heroTitle.innerText = "カレーグランプリ 結果発表";
            }
        }

        async function fetchLiveResults() {
            if (GAS_API_URL.includes("YOUR_DEPLOYMENT_ID")) {
                renderMockData();
                return;
            }

            try {
                const res = await fetch(GAS_API_URL);
                const data = await res.json();
                renderAll(data);
            } catch (err) {
                console.error("Fetch Error:", err);
                renderMockData();
            }
        }

        function renderAll(data) {
            if (data.photo) renderPhotoResults(data.photo);
            if (data.curry) renderCurryResults(data.curry);
        }

        // 写真グランプリ描画（同点防止 0.001 計算 ＋ 小数点切り捨て）
        function renderPhotoResults(photoData) {
            photoData.ranking.forEach(item => {
                const subTotal = (item.teamwork || 0) + (item.repro || 0) + (item.humor || 0);
                item.calcScore = (item.grand || 0) + (subTotal * 0.001);
            });
            photoData.ranking.sort((a, b) => b.calcScore - a.calcScore);

            const rankList = document.getElementById('photoRankingList');
            rankList.innerHTML = "";
            photoData.ranking.forEach((item, index) => {
                const rankNum = index + 1;
                const rankClass = rankNum === 1 ? 'rank-1' : rankNum === 2 ? 'rank-2' : rankNum === 3 ? 'rank-3' : '';
                const winnerBadge = rankNum === 1 ? '<div style="font-size:10px; color:var(--gold); font-weight:800;">👑 GRAND PRIX WINNER</div>' : '';
                const displayScore = Math.floor(item.calcScore);

                const card = document.createElement('div');
                card.className = `rank-card ${rankClass}`;
                card.innerHTML = `
                    <div class="rank-left">
                        <div class="rank-num">${rankNum}</div>
                        <div>
                            <div class="rank-team">${item.team}</div>
                            ${winnerBadge}
                            <div class="rank-breakdown">最優秀:${item.grand || 0}票 | TW:${item.teamwork} 再現:${item.repro} 劇的:${item.humor}</div>
                        </div>
                    </div>
                    <div class="rank-score-wrap">
                        <span class="rank-score">${displayScore}</span><span class="rank-unit">票</span>
                    </div>
                `;
                rankList.appendChild(card);
            });

            // 写真 部門賞
            document.getElementById('photoCategoryGrid').innerHTML = `
                <div class="category-card">
                    <div class="category-name">🤝 チームワーク賞</div>
                    <div class="category-winner">${photoData.categories.teamwork.team}</div>
                    <div class="category-votes">最多 ${photoData.categories.teamwork.votes} 票！</div>
                    <p style="font-size:10px; color:var(--text-sub); margin:4px 0 0 0;">全員の一体感が最高評価！</p>
                </div>
                <div class="category-card">
                    <div class="category-name">📐 構図・ポーズ再現度賞</div>
                    <div class="category-winner">${photoData.categories.repro.team}</div>
                    <div class="category-votes">最多 ${photoData.categories.repro.votes} 票！</div>
                    <p style="font-size:10px; color:var(--text-sub); margin:4px 0 0 0;">AIのお手本スケッチを忠実に再現！</p>
                </div>
                <div class="category-card">
                    <div class="category-name">🎭 ドラマ・ユーモア賞</div>
                    <div class="category-winner">${photoData.categories.humor.team}</div>
                    <div class="category-votes">最多 ${photoData.categories.humor.votes} 票！</div>
                    <p style="font-size:10px; color:var(--text-sub); margin:4px 0 0 0;">思わずクスッと笑った名シーン！</p>
                </div>
            `;

            // 写真 コメント
            renderComments('photoCommentGrid', photoData.comments);
        }

        // カレーグランプリ描画
        function renderCurryResults(curryData) {
            curryData.ranking.sort((a, b) => b.totalScore - a.totalScore);

            const rankList = document.getElementById('curryRankingList');
            rankList.innerHTML = "";
            curryData.ranking.forEach((item, index) => {
                const rankNum = index + 1;
                const rankClass = rankNum === 1 ? 'rank-1' : rankNum === 2 ? 'rank-2' : rankNum === 3 ? 'rank-3' : '';
                const winnerBadge = rankNum === 1 ? '<div style="font-size:10px; color:var(--gold); font-weight:800;">🍛 CURRY CHAMPION</div>' : '';

                const card = document.createElement('div');
                card.className = `rank-card ${rankClass}`;
                card.innerHTML = `
                    <div class="rank-left">
                        <div class="rank-num">${rankNum}</div>
                        <div>
                            <div class="rank-team">${item.team}</div>
                            ${winnerBadge}
                            <div class="rank-breakdown">味:${item.taste || 0} | 見た目:${item.visual || 0} | 独創性:${item.unique || 0}</div>
                        </div>
                    </div>
                    <div class="rank-score-wrap">
                        <span class="rank-score">${item.totalScore}</span><span class="rank-unit">pt</span>
                    </div>
                `;
                rankList.appendChild(card);
            });

            // カレー 部門賞
            document.getElementById('curryCategoryGrid').innerHTML = `
                <div class="category-card">
                    <div class="category-name">👅 絶品！味の極み賞</div>
                    <div class="category-winner">${curryData.categories.taste.team}</div>
                    <div class="category-votes">最多 ${curryData.categories.taste.votes} 票！</div>
                    <p style="font-size:10px; color:var(--text-sub); margin:4px 0 0 0;">ルーのコクと旨味が圧倒的一番人気！</p>
                </div>
                <div class="category-card">
                    <div class="category-name">🎨 盛り付け・ビジュアル美賞</div>
                    <div class="category-winner">${curryData.categories.visual.team}</div>
                    <div class="category-votes">最多 ${curryData.categories.visual.votes} 票！</div>
                    <p style="font-size:10px; color:var(--text-sub); margin:4px 0 0 0;">大鍋とトッピングの彩りが食欲を刺激！</p>
                </div>
                <div class="category-card">
                    <div class="category-name">🌶️ スパイス独創性賞</div>
                    <div class="category-winner">${curryData.categories.unique.team}</div>
                    <div class="category-votes">最多 ${curryData.categories.unique.votes} 票！</div>
                    <p style="font-size:10px; color:var(--text-sub); margin:4px 0 0 0;">隠し味のスパイス配合に審査員絶賛！</p>
                </div>
            `;

            // カレー コメント
            renderComments('curryCommentGrid', curryData.comments);
        }

        function renderComments(containerId, comments) {
            const container = document.getElementById(containerId);
            if (comments && comments.length > 0) {
                container.innerHTML = "";
                comments.forEach(c => {
                    const bubble = document.createElement('div');
                    bubble.className = "comment-bubble";
                    bubble.innerHTML = `
                        <div class="comment-header">
                            <span class="comment-user">👤 ${c.user}</span>
                        </div>
                        <p class="comment-body">「${c.text}」</p>
                    `;
                    container.appendChild(bubble);
                });
            } else {
                container.innerHTML = '<div class="loading-box">まだコメントはありません。</div>';
            }
        }

        // ダミーデータ（オフライン・テスト用）
        function renderMockData() {
            renderPhotoResults({
                ranking: [
                    { team: "チームA", teamwork: 8, repro: 6, humor: 5, grand: 6 },
                    { team: "チームC", teamwork: 5, repro: 5, humor: 4, grand: 6 },
                    { team: "チームB", teamwork: 3, repro: 2, humor: 9, grand: 4 },
                    { team: "チームD", teamwork: 2, repro: 3, humor: 2, grand: 2 }
                ],
                categories: {
                    teamwork: { team: "チームA", votes: 8 },
                    repro: { team: "チームA", votes: 6 },
                    humor: { team: "チームB", votes: 9 }
                },
                comments: [
                    { user: "参加者1", text: "チームAのルーを投入する瞬間がプロ並みでした！" },
                    { user: "参加者2", text: "チームBの偵察部隊のポーズがツボに入って面白かったです。" }
                ]
            });

            renderCurryResults({
                ranking: [
                    { team: "チームB", taste: 12, visual: 8, unique: 9, totalScore: 29 },
                    { team: "チームA", taste: 10, visual: 9, unique: 7, totalScore: 26 },
                    { team: "チームC", taste: 8, visual: 7, unique: 8, totalScore: 23 },
                    { team: "チームD", taste: 7, visual: 6, unique: 6, totalScore: 19 }
                ],
                categories: {
                    taste: { team: "チームB", votes: 12 },
                    visual: { team: "チームA", votes: 9 },
                    unique: { team: "チームB", votes: 9 }
                },
                comments: [
                    { user: "審査員A", text: "チームBの隠し味スパイスの深みが素晴らしく、ご飯が進みました！" },
                    { user: "参加者3", text: "チームAの野菜の火入れとルーのツヤがプロ級でした。" }
                ]
            });
        }

        document.getElementById('refreshBtn').onclick = fetchLiveResults;
        window.onload = fetchLiveResults;
    </script>
</body>
</html>

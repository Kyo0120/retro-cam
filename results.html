<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>表彰式・結果発表 | カレーGP フォトアワード</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --surface-bg: rgba(20, 24, 32, 0.85);
            --surface-card: rgba(26, 31, 42, 0.75);
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ff9f1a;
            --accent-glow: rgba(255, 159, 26, 0.4);
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --text-main: #f0f3f6;
            --text-sub: #9aa4b2;
            --free-color: #2ed573;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            position: sticky; top: 0;
            background: rgba(11, 13, 16, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--surface-border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        .header-title { font-size: 14px; font-weight: 800; color: var(--accent-color); letter-spacing: 0.5px; }
        .nav-links { display: flex; gap: 8px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--surface-border);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-btn.accent {
            color: var(--accent-color);
            border-color: rgba(255, 159, 26, 0.35);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 24px 16px 60px 16px; }

        .hero { text-align: center; margin-bottom: 28px; }
        .hero-badge {
            display: inline-block;
            background: rgba(255, 159, 26, 0.12);
            border: 1px solid rgba(255, 159, 26, 0.4);
            color: var(--accent-color);
            font-size: 10px; font-weight: 800;
            padding: 4px 12px; border-radius: 20px;
            letter-spacing: 1.5px; margin-bottom: 10px;
        }
        h1 { margin: 0 0 8px 0; font-size: 1.8rem; font-weight: 900; letter-spacing: -0.5px; }
        .hero-desc { font-size: 12.5px; color: var(--text-sub); }

        .section-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            backdrop-filter: blur(12px);
        }
        .section-title {
            font-size: 14px; font-weight: 800; color: var(--accent-color);
            margin: 0 0 16px 0; display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--surface-border); padding-bottom: 10px;
        }

        /* 総合ランキング */
        .ranking-list { display: flex; flex-direction: column; gap: 10px; }
        .rank-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .rank-card.rank-1 {
            border: 2px solid var(--gold);
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.12), rgba(0,0,0,0.4));
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.25);
        }
        .rank-card.rank-2 { border: 1.5px solid var(--silver); }
        .rank-card.rank-3 { border: 1.5px solid var(--bronze); }

        .rank-left { display: flex; align-items: center; gap: 14px; }
        .rank-num {
            font-size: 1.6rem; font-weight: 900; line-height: 1;
            font-family: "Courier New", monospace;
            width: 32px; text-align: center;
        }
        .rank-1 .rank-num { color: var(--gold); }
        .rank-2 .rank-num { color: var(--silver); }
        .rank-3 .rank-num { color: var(--bronze); }
        .rank-team { font-size: 15px; font-weight: 800; color: #fff; }
        .rank-breakdown { font-size: 10px; color: var(--text-sub); margin-top: 2px; }
        
        .rank-score-wrap {
            text-align: right;
        }
        .rank-score {
            font-size: 1.6rem; font-weight: 900; color: var(--accent-color);
            font-feature-settings: "tnum";
            font-family: "Courier New", monospace;
        }
        .rank-unit { font-size: 11px; color: var(--text-sub); margin-left: 2px; font-weight: 700; }

        /* 個別部門賞 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .category-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 14px;
            border-top: 3px solid var(--accent-color);
        }
        .category-name { font-size: 11px; font-weight: 700; color: var(--text-sub); }
        .category-winner { font-size: 16px; font-weight: 900; color: #fff; margin: 4px 0 2px 0; }
        .category-votes { font-size: 11px; color: var(--accent-color); font-weight: 700; }

        /* コメント */
        .comment-grid { display: flex; flex-direction: column; gap: 10px; }
        .comment-bubble {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .comment-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; font-size: 10px; color: var(--text-sub);
        }
        .comment-user { font-weight: 800; color: var(--accent-color); }
        .comment-body { font-size: 12px; color: #d1d5db; line-height: 1.5; margin: 0; }

        .loading-box { text-align: center; padding: 30px; color: var(--text-sub); font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">🏆 GRAND PRIX AWARDS</div>
        <div class="nav-links">
            <button class="nav-btn accent" id="refreshBtn">🔄 最新に更新</button>
            <a href="home.html" class="nav-btn">🏠️ Home</a>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <span class="hero-badge">LIVE RESULTS</span>
            <h1>写真グランプリ 結果発表</h1>
            <div class="hero-desc">Google フォーム投票スプレッドシートからリアルタイム集計中</div>
        </div>

        <!-- 総合ランキング -->
        <div class="section-card">
            <div class="section-title">🥇 総合ランキング（最優秀グランプリ）</div>
            <div class="ranking-list" id="rankingList">
                <div class="loading-box">スプレッドシートから集計データを取得しています...</div>
            </div>
        </div>

        <!-- 個別部門ランキング -->
        <div class="section-card">
            <div class="section-title">🎖️ 個別部門賞</div>
            <div class="category-grid" id="categoryGrid">
                <div class="loading-box">集計中...</div>
            </div>
        </div>

        <!-- コメント要約・ハイライト -->
        <div class="section-card">
            <div class="section-title">💬 参加者からの投票メッセージ</div>
            <div class="comment-grid" id="commentGrid">
                <div class="loading-box">コメントを読み込み中...</div>
            </div>
        </div>
    </div>

    <script>
        // ★ デプロイしたGASのWebアプリURL（設定済みであれば差し替えてください）
        const GAS_API_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

        async function fetchLiveResults() {
            if (GAS_API_URL.includes("YOUR_DEPLOYMENT_ID")) {
                renderMockData();
                return;
            }

            try {
                const res = await fetch(GAS_API_URL);
                const data = await res.json();
                renderResults(data);
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('rankingList').innerHTML = 
                    '<div class="loading-box" style="color:var(--danger);">集計データの取得に失敗しました。<br>GASの公開設定を確認してください。</div>';
            }
        }

        function renderResults(data) {
            // 1. 総合ランキングのソート処理
            // スコア算出：最優秀票 + (チームワーク + 再現度 + ユーモア) * 0.001
            data.ranking.forEach(item => {
                const subTotal = (item.teamwork || 0) + (item.repro || 0) + (item.humor || 0);
                item.calcScore = (item.grand || 0) + (subTotal * 0.001);
            });

            // 正確なスコア（小数含む）で降順ソート（同点時の判定を完全自動化）
            data.ranking.sort((a, b) => b.calcScore - a.calcScore);

            // 総合ランキングの描画
            const rankList = document.getElementById('rankingList');
            rankList.innerHTML = "";
            data.ranking.forEach((item, index) => {
                const rankNum = index + 1;
                const rankClass = rankNum === 1 ? 'rank-1' : rankNum === 2 ? 'rank-2' : rankNum === 3 ? 'rank-3' : '';
                const winnerBadge = rankNum === 1 ? '<div style="font-size:10px; color:var(--gold); font-weight:800;">👑 GRAND PRIX WINNER</div>' : '';

                // ★ 小数点以下は切り捨て、整数のみで表示 ★
                const displayScore = Math.floor(item.calcScore);

                const card = document.createElement('div');
                card.className = `rank-card ${rankClass}`;
                card.innerHTML = `
                    <div class="rank-left">
                        <div class="rank-num">${rankNum}</div>
                        <div>
                            <div class="rank-team">${item.team}</div>
                            ${winnerBadge}
                            <div class="rank-breakdown">最優秀:${item.grand || 0}票 | TW:${item.teamwork} 再現:${item.repro} 劇的:${item.humor}</div>
                        </div>
                    </div>
                    <div class="rank-score-wrap">
                        <span class="rank-score">${displayScore}</span><span class="rank-unit">票</span>
                    </div>
                `;
                rankList.appendChild(card);
            });

            // 2. 個別部門賞の描画
            const catGrid = document.getElementById('categoryGrid');
            catGrid.innerHTML = `
                <div class="category-card">
                    <div class="category-name">🤝 チームワーク賞</div>
                    <div class="category-winner">${data.categories.teamwork.team}</div>
                    <div class="category-votes">最多 ${data.categories.teamwork.votes} 票獲得！</div>
                    <p style="font-size:10px; color:var(--text-sub); margin:4px 0 0 0;">全員の一体感・楽しそうな雰囲気が最高評価！</p>
                </div>
                <div class="category-card">
                    <div class="category-name">📐 構図・ポーズ再現度賞</div>
                    <div class="category-winner">${data.categories.repro.team}</div>
                    <div class="category-votes">最多 ${data.categories.repro.votes} 票獲得！</div>
                    <p style="font-size:10px; color:var(--text-sub); margin:4px 0 0 0;">AIのお手本スケッチを見事に再現した1枚！</p>
                </div>
                <div class="category-card">
                    <div class="category-name">🎭 ドラマ・ユーモア賞</div>
                    <div class="category-winner">${data.categories.humor.team}</div>
                    <div class="category-votes">最多 ${data.categories.humor.votes} 票獲得！</div>
                    <p style="font-size:10px; color:var(--text-sub); margin:4px 0 0 0;">思わずクスッと笑ってしまったエモい瞬間！</p>
                </div>
            `;

            // 3. コメントの描画
            const comGrid = document.getElementById('commentGrid');
            if (data.comments && data.comments.length > 0) {
                comGrid.innerHTML = "";
                data.comments.forEach(c => {
                    const bubble = document.createElement('div');
                    bubble.className = "comment-bubble";
                    bubble.innerHTML = `
                        <div class="comment-header">
                            <span class="comment-user">👤 ${c.user}</span>
                        </div>
                        <p class="comment-body">「${c.text}」</p>
                    `;
                    comGrid.appendChild(bubble);
                });
            } else {
                comGrid.innerHTML = '<div class="loading-box">まだコメントはありません。</div>';
            }
        }

        // ダミーデータ（テスト用：チームAとチームCが最優秀6票で並んでも、各評価点の差で順位が決定）
        function renderMockData() {
            renderResults({
                ranking: [
                    { team: "チームA", teamwork: 8, repro: 6, humor: 5, grand: 6 }, // 6 + 0.019
                    { team: "チームC", teamwork: 5, repro: 5, humor: 4, grand: 6 }, // 6 + 0.014 (同票だが2位へ)
                    { team: "チームB", teamwork: 3, repro: 2, humor: 9, grand: 4 }, // 4 + 0.014
                    { team: "チームD", teamwork: 2, repro: 3, humor: 2, grand: 2 }  // 2 + 0.007
                ],
                categories: {
                    teamwork: { team: "チームA", votes: 8 },
                    repro: { team: "チームA", votes: 6 },
                    humor: { team: "チームB", votes: 9 }
                },
                comments: [
                    { user: "参加者1", text: "チームAのルーを投入する瞬間がプロ並みでした！" },
                    { user: "参加者2", text: "チームBの偵察部隊のポーズがツボに入って面白かったです。" }
                ]
            });
        }

        document.getElementById('refreshBtn').onclick = fetchLiveResults;
        window.onload = fetchLiveResults;
    </script>
</body>
</html>

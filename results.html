<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Curry Grand Prix - Photo Gallery</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --surface-bg: rgba(20, 24, 32, 0.88);
            --surface-card: rgba(26, 31, 42, 0.75);
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent-color: #ff9f1a;
            --accent-glow: rgba(255, 159, 26, 0.35);
            --text-main: #f0f3f6;
            --text-sub: #8a94a6;
            --danger: #ff4757;
            --free-color: #2ed573;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* 1. 最上部ヘッダー（固定） */
        header {
            position: sticky;
            top: 0;
            background: rgba(11, 13, 16, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--surface-border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 200;
        }
        .header-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .header-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--surface-border);
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .header-btn.accent {
            background: rgba(255, 159, 26, 0.15);
            border-color: rgba(255, 159, 26, 0.4);
            color: var(--accent-color);
        }

        /* 2. ★常時固定のチーム選択 ＆ 撮影枚数バー★ */
        .sticky-control-bar {
            position: sticky;
            top: 51px; /* ヘッダーの高さ直下 */
            background: rgba(15, 18, 24, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 159, 26, 0.2);
            padding: 8px 14px;
            z-index: 190;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        /* チーム選択タブ */
        .team-tabs {
            display: flex;
            gap: 6px;
            flex: 1;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .team-tabs::-webkit-scrollbar { display: none; }

        .team-tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .team-tab-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* 撮影枚数カウンターバッジ（常時表示） */
        .sticky-counter-badge {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 159, 26, 0.4);
            padding: 4px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .counter-label {
            font-size: 9.5px;
            color: var(--text-sub);
            font-weight: 700;
        }
        .counter-number {
            font-size: 13px;
            font-weight: 900;
            color: var(--accent-color);
            font-family: "Courier New", monospace;
        }

        /* メインコンテナ */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 14px 14px 60px 14px;
        }

        /* 写真グリッド */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .photo-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .photo-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            background: #000;
            overflow: hidden;
        }
        .photo-img {
            width: 100%; height: 100%; object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .photo-img:active { transform: scale(0.98); }

        .team-pill {
            position: absolute;
            top: 8px; left: 8px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        .photo-meta {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .meta-title {
            font-size: 12px;
            font-weight: 800;
            color: #fff;
        }
        .meta-time {
            font-size: 9.5px;
            color: var(--text-sub);
            font-family: "Courier New", monospace;
        }

        /* 空状態・ローディング */
        .status-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            font-size: 12px;
            grid-column: 1 / -1;
        }

        /* 拡大モーダル */
        #zoomModal {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(14px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-inner {
            max-width: 95%; max-height: 90vh;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .modal-img {
            max-width: 100%; max-height: 80vh;
            border-radius: 10px; object-fit: contain;
            border: 1px solid var(--surface-border);
        }
        .modal-cap { font-size: 12px; color: #fff; font-weight: 700; text-align: center; }
    </style>
</head>
<body>

    <!-- 1. 最上部ヘッダー（固定） -->
    <header>
        <div class="header-title">📷 PHOTO GALLERY</div>
        <div class="header-actions">
            <!-- ★Homeへのリンク★ -->
            <a href="home.html" class="header-btn accent">🏠️ Homeへ</a>
            <!-- ★フォームへのリンク★ -->
            <a href="https://forms.gle/fhFzxPfTXiwS39g27" target="_blank" rel="noopener noreferrer" class="header-btn accent">🗳️ 投票する</a>
            <button class="header-btn" id="reloadBtn">🔄 最新に更新</button>
        </div>
    </header>

    <!-- 2. ★常時固定のチーム選択 ＆ 撮影枚数バー★ -->
    <div class="sticky-control-bar">
        <div class="control-row">
            <!-- チーム切り替えタブ -->
            <div class="team-tabs">
                <button class="team-tab-btn active" onclick="filterTeam('ALL')">全チーム</button>
                <button class="team-tab-btn" onclick="filterTeam('A')">チームA</button>
                <button class="team-tab-btn" onclick="filterTeam('B')">チームB</button>
                <button class="team-tab-btn" onclick="filterTeam('C')">チームC</button>
                <button class="team-tab-btn" onclick="filterTeam('D')">チームD</button>
            </div>

            <!-- 撮影枚数カウンター -->
            <div class="sticky-counter-badge">
                <span class="counter-label" id="counterLabel">全写真</span>
                <span class="counter-number" id="photoCount">0枚</span>
            </div>
        </div>
    </div>

    <!-- 3. 写真一覧コンテナ -->
    <div class="container">
        <div class="gallery-grid" id="galleryGrid">
            <div class="status-box" id="loadingStatus">写真を読み込んでいます...</div>
        </div>
    </div>

    <!-- 拡大モーダル -->
    <div id="zoomModal" onclick="closeModal()">
        <div class="modal-inner">
            <img id="zoomImg" class="modal-img" src="" alt="拡大写真">
            <div id="zoomCap" class="modal-cap"></div>
            <div style="font-size:10px; color:var(--text-sub);">(タップで閉じる)</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, listAll, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHqQDeEMrFV09YI0n_ARr1Tzta5aqmE2U",
            authDomain: "my-retro-cam.firebaseapp.com",
            projectId: "my-retro-cam",
            storageBucket: "my-retro-cam.firebasestorage.app",
            messagingSenderId: "700098109654",
            appId: "1:700098109654:web:9d679cbd092c1376642977"
        };

        const missionNames = {
            "00": "0. 操作練習（テスト）",
            "01": "1. 集合：決起集会",
            "02": "2. 買い出し：目利き",
            "03": "3. 放課後：放課後の記憶",
            "04": "4. 散策：偵察部隊",
            "05": "5. 調理中：シェフの神業",
            "06": "6. BBQ：完成の歓喜",
            "free": "フリー撮影"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const auth = getAuth(app);

        let allPhotos = [];
        let currentFilter = "ALL";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadPhotos();
            } else {
                signInAnonymously(auth);
            }
        });

        async function loadPhotos() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '<div class="status-box">最新写真を読み込んでいます...</div>';

            try {
                const listRef = ref(storage, 'photos/');
                const res = await listAll(listRef);

                const items = await Promise.all(res.items.map(async (itemRef) => {
                    const url = await getDownloadURL(itemRef);
                    const name = itemRef.name; // 例: curry_teamA_01_20261029-123000.jpg
                    
                    let team = "不明";
                    let mission = "free";
                    let timeStr = "";

                    const parts = name.replace('.jpg', '').split('_');
                    if (parts.length >= 4) {
                        team = parts[1].replace('team', ''); // "A"
                        mission = parts[2];                  // "01" or "free"
                        timeStr = parts[3];
                    }

                    return { url, name, team, mission, timeStr };
                }));

                // 日時降順（新しい順）
                items.sort((a, b) => b.name.localeCompare(a.name));
                allPhotos = items;
                renderGallery();
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="status-box" style="color:var(--danger);">写真の読み込みに失敗しました。再読み込みしてください。</div>';
            }
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = "";

            const filtered = (currentFilter === "ALL") 
                ? allPhotos 
                : allPhotos.filter(p => p.team === currentFilter);

            // ★常時固定カウンターの更新★
            const counterLabel = document.getElementById('counterLabel');
            const counterNumber = document.getElementById('photoCount');
            if (currentFilter === "ALL") {
                counterLabel.innerText = "全写真";
            } else {
                counterLabel.innerText = `チーム${currentFilter}`;
            }
            counterNumber.innerText = `${filtered.length}枚`;

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="status-box">該当する写真がまだありません。</div>';
                return;
            }

            filtered.forEach(p => {
                const missionTitle = missionNames[p.mission] || `ミッション ${p.mission}`;
                const card = document.createElement('div');
                card.className = "photo-card";
                card.innerHTML = `
                    <div class="photo-img-wrap">
                        <span class="team-pill">チーム${p.team}</span>
                        <img class="photo-img" src="${p.url}" alt="${missionTitle}" loading="lazy">
                    </div>
                    <div class="photo-meta">
                        <div class="meta-title">${missionTitle}</div>
                        <div class="meta-time">${p.timeStr || ''}</div>
                    </div>
                `;

                card.querySelector('.photo-img').onclick = () => {
                    openModal(p.url, `チーム${p.team} - ${missionTitle}`);
                };

                grid.appendChild(card);
            });
        }

        window.filterTeam = (teamKey) => {
            currentFilter = teamKey;
            document.querySelectorAll('.team-tab-btn').forEach(btn => {
                if ((teamKey === 'ALL' && btn.innerText === '全チーム') || btn.innerText === `チーム${teamKey}`) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderGallery();
        };

        window.openModal = (url, caption) => {
            document.getElementById('zoomImg').src = url;
            document.getElementById('zoomCap').innerText = caption;
            document.getElementById('zoomModal').style.display = 'flex';
        };

        window.closeModal = () => {
            document.getElementById('zoomModal').style.display = 'none';
        };

        document.getElementById('reloadBtn').onclick = loadPhotos;
    </script>
</body>
</html>
